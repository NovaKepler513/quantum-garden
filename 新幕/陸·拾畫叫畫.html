═══════════════════════════════════════════════════════════════════════════
量子游园 · 新幕试验 · 第陸幕「拾畫 · 叫畫」(独立试验稿,单文件自包含)

【概念】量子概念 = 量子隐形传态:不可克隆的另一半,如何渡回来——
  寫真一幕,麗娘拷不走自己的瞳(量子不可克隆——自我测量画不出眼);
  这一幕由柳夢梅叫醒:预共享纠缠(他第二出梦过她,故名梦梅)+三声经典信道(呼唤),
  复原那拷不走的态——只有爱,完成测量。
  戏文依据:《牡丹亭》第二十四出《拾畫》/ 第二十六出《玩真》(俗称叫畫)——
  柳夢梅拾得画像,对画连呼「美人,美人!姐姐,姐姐!」(通行本原文,两组共四呼,右侧款识即此四呼;
  交互取「三唤点睛」之三声,逐声点亮款识 2+2+4 字,不与四呼一一对应)。
  画像之名「春容」从剧中通行称谓;展卷初认观音/嫦娥从拾画·玩真原折。其余提示语皆自拟,不作原文标注。

【交互流程】
  1. 拾畫(phase=sweep):指针拂亮太湖石字堆(grp「石」, c>0.8 计亮),
     亮够 55% →「卷」字自石中显形(金,呼吸光晕)→ 点「卷」。
  2. 展卷(phase=unroll):立轴自上而下 2.6s 徐徐展开,画像字粒逐行重现——
     没有瞳,整像略冷(暖度 warm≈0.35)。
  3. 叫畫(phase=call):出声唤(麦克风 RMS,无麦自动退点击)/点画像/空格,唤三声。
     每声并点亮右缘款识(第1声「美人」/第2声「美人」/第3声「姐姐姐姐」)。每声:自像心荡开一圈涟漪
     (字粒径向微推 0.09 虚拟单位)+一记磬,三声上行 羽883 → 清宫1046.5 → 清商1177.3。
     第1声 像微亮;第2声 满纸字粒齐齐闪变一轮;第3声 双「瞳」亮起(全场唯一新增字),
     瞳亮时再一记轻清商——画中人看见他了。
  4. 醒(phase=awake):整像 2s 由冷转暖(warm→1),像面极缓呼吸(0.9rad/s,±7%),
     麗娘半身前浮(整像放大 5%),瞳最亮。2.4s 后轴下浮出口「幽」(此去幽媾)。
  5. 出口:点「幽」或 → 键 →「本幕終 —— 拾畫·叫畫」淡出,回开场遮罩。

【参数表】
  虚拟坐标 16:9(VW=16,VH=9), scale/ox/oy/MX/MY 照主作品
  布局 LCG 种子 20260612(确定性;动效用 Math.random)
  BRUSH=短边×0.2 | c 上升按 dt 归一(60Hz 等效 0.12/帧)·只升不降 | 真字阈 0.8(统一)
  石堆点亮阈 0.55 | 「卷」显形 1.8s | 展卷 2.6s
  涟漪速 4.2 单位/s·带宽 0.55·推幅 0.09 | 唤声间隔 ≥0.85s
  暖度追随 dt×1.1 | 前浮 +5%/2s | 呼吸 0.9rad/s ±7% | 瞳亮 0.8s
  gateA 渐显 2.6s | 出口点击半径 R×1.6(R=短边×0.078)
  律制:三分损益,GONG=523.25(宫=C5);叫画三声 羽/清宫/清商
  入幽=低宫 261.6(刻意反"开门=宫"之全局约定:幽媾向死,声沉半轮——非 bug,勿改回)
  出声唤:RMS 瞬时 0.10 立即触发 / 持续 0.045 累积 0.22s(同主作品吹气参数 §2.5)
  虫鸣:4.2–5.3kHz 双点,音量 0.018(≤0.02),每 1.1s 28% 概率
  键盘:空格=唤一声(畫成後;入园前=入园) | →=前行(门启后) | R=重看本幕

【修订】2026-06-12 三人评审修订:回环遮罩提前唤回(t>3.4,门不闪现)|款识「美人姐姐」随三声点亮+
  头注"三呼"订正为四呼|画像改肆·寫真同款侧影字粒点集(镜像面朝右望柳生;awake 金名「麗娘」自心口浮显)|
  景名/月组/柳生豁免叠加·柳生落地添「影」|出声唤(RMS,兜底点击)|UI 标点全角|zh-Hant+繁体字体兜底|
  认画一拍(观音/嫦娥)|轴杆「軸杆杆杆軸」顶绫「綾絹綾絹綾」变奏|装裱不随画动|幽暗衬收窄 R×1.3|
  静卷嵌石+游移闪变|瞳亮门限改按几何实算|键位说明按 phase 切换|Sound.stop() 备切幕清理
【修订二】2026-06-12 一葳实玩反馈:①卷石区分——窍扩 0.58→0.74 并沉至石根(4.6,7.0),石卷之间垫苔蘚小字,
  「卷」显形加出口同款暗底衬纸(白处生字,不与石字相混);②款识去干巴——波至即洇(c 自 0.3 升 ~0.4s,
  先颤后真)替代瞬亮,右缘款识全体(引号匣+名)受唤声涟漪同摆同微明(与画同一片水),唤定后金晕余温 1.4s
  渐冷;③题诗互文(dramaturg)——画上添《寫真》原文题诗两列「他年得傍蟾宮客／不在梅邊在柳邊」(肆幕
  她亲笔,两幕同一张画),谶字「柳」「梅」与瞳同亮

    <div class="big">拾 畫 · 叫 畫</div>

    <div class="legend">三次呼喚，讓畫中人醒來</div>

<script>
"use strict";
const SERIF='"Songti SC","STSong","Noto Serif TC","PMingLiU","SimSun",serif', TAU=Math.PI*2;
const motionQuery=window.matchMedia('(prefers-reduced-motion: reduce)');
let REDUCED_MOTION=motionQuery.matches;
if(motionQuery.addEventListener) motionQuery.addEventListener('change',e=>{ REDUCED_MOTION=e.matches; });
const motionSin=x=>REDUCED_MOTION?0:Math.sin(x);
const revealStep=dt=>1-Math.pow(0.88,dt*60);
const cv=document.getElementById('scene');
let ctx=cv.getContext('2d');
let W,H,DPR=1, scale, ox, oy, BRUSH=200;

/* 确定性随机(仅用于布局) */
const SEED=20260612;
let _s=SEED>>>0;
const rnd=()=>{ _s=(_s*1664525+1013904223)>>>0; return _s/4294967296; };
const smooth=t=>t*t*(3-2*t);
const lerp=(a,b,t)=>a+(b-a)*t;

/* ====== 字成画引擎(照主作品) ====== */
const T1=1.0,T2=0.78,T3=0.56,T4=0.42,T5=0.33,T6=0.26,T7=0.21,T8=0.175;
const COL={ fig:"#ede7d8", near:"#ede7d8", mid:"#83998f", far:"#668d82",
            faint:"#668d82", ghost:"#668d82", water:"#83998f", gold:"#d2ae68" };
const VW=16, VH=9;
const items=[], boxes=[], PROTECT=[]; let _grp=null;
function hit(x,y,w,h){ for(const b of boxes){ if(Math.abs(x-b.x)<(w+b.w)/2 && Math.abs(y-b.y)<(h+b.h)/2) return true; } return false; }
function put(x,y,text,size,color,o){
  o=o||{}; const vert=!!o.vert, f=o.f==null?0.94:o.f, pad=o.pad==null?0.05:o.pad;
  const w=((vert?1:text.length)*size+pad)*f, h=((vert?text.length:1)*size+pad)*f;
  if(hit(x,y,w,h)) return false;
  boxes.push({x,y,w,h});
  items.push({x,y,text,size,color,vert,grp:_grp,a:o.a==null?(0.85+rnd()*0.15):o.a});
  return true;
}
function protect(x0,y0,x1,y1){ PROTECT.push({x0,y0,x1,y1}); }
function inProtect(x,y){ for(const p of PROTECT){ if(x>=p.x0&&x<=p.x1&&y>=p.y0&&y<=p.y1) return true; } return false; }
const pick=v=>v[(rnd()*v.length)|0];
function anchor(x,y,ch,size,color,a){ if(put(x,y,ch,size,color,{pad:0.14,a:a==null?1:a})) items[items.length-1].anc=true; }
function organic(cx,cy,rx,ry,vocab,size,color,density){ density=density==null?1:density;
  const n=Math.max(4,(Math.PI*rx*ry/(size*size)*density)|0); let placed=0,tries=0;
  while(placed<n && tries<n*7){ tries++; const a=rnd()*Math.PI*2,r=Math.sqrt(rnd());
    if(put(cx+Math.cos(a)*rx*r,cy+Math.sin(a)*ry*r,pick(vocab),size*(0.85+rnd()*0.3),color,{f:0.95,pad:0.04})) placed++; } }
function gridRow(cx,y,cols,gx,vocab,size,color,jit){ jit=jit==null?0.05:jit; const x0=cx-(cols-1)*gx/2;
  for(let c=0;c<cols;c++) put(x0+c*gx+(rnd()-0.5)*gx*jit, y+(rnd()-0.5)*size*jit, pick(vocab), size, color,{f:0.96,pad:0.03}); }
function gridCol(cx,y0,rows,gy,vocab,size,color,jit){ jit=jit==null?0.05:jit;
  for(let r=0;r<rows;r++) put(cx+(rnd()-0.5)*size*jit, y0+r*gy+(rnd()-0.5)*gy*jit, pick(vocab), size, color,{f:0.96,pad:0.03}); }
const V={ rock:[..."石巖苔蘚磴罅竅皺漏"], moss:[..."苔蘚"], wall:[..."牆甎"], cloud:[..."雲霞煙靄絮"],
  glow:[..."光華暉皎"], flower:["牡丹","海棠","芍藥","薔薇","荼蘼","蘭"] };
function moonCluster(cx,cy){ anchor(cx,cy,"月",T2,COL.gold,1);
  [["皎",-0.62,-0.5],["桂",-0.7,0.42],["魄",0.66,-0.42],["盤",0.62,0.48],["蟾",0.0,-0.84]]
    .forEach(([t,dx,dy])=>put(cx+dx,cy+dy,t,T5,COL.gold,{f:0.9,a:0.82}));
  for(let k=0;k<24;k++){ const a=k/24*TAU; put(cx+Math.cos(a)*1.45,cy+Math.sin(a)*1.35,pick([..."暈霧霏"]),T7,COL.gold,{f:0.58,pad:0.03,a:0.26}); }
  protect(cx-1.7,cy-1.6,cx+1.7,cy+1.6); }
function figureM(x,top,name,size,head){ // 柳夢梅:冠 + 名 + 袖袍(照主作品)
  let y=top; for(const ch of [...name]){ put(x,y,ch,size,COL.fig,{f:0.96,pad:0.05,a:0.97}); y+=size*1.18; }
  if(head) put(x,top-size*0.85,head,size*0.55,COL.near,{f:0.6,a:0.92});
  put(x-size*0.55,top,"袖",size*0.42,COL.near,{f:0.85,a:0.8}); put(x+size*0.55,top,"袖",size*0.42,COL.near,{f:0.85,a:0.8});
  put(x,y,"袍",size*0.5,COL.near,{f:0.85,a:0.82}); protect(x-size*0.95,top-size*1.1,x+size*0.95,y+size*0.5); }

/* ====== 画像(立轴内容,独立于 items 的字粒层) ====== */
const SC={cx:8, top:1.75, bot:7.35, hw:1.35, pcy:4.2};   // 立轴几何(虚拟坐标);pcy=像心(涟漪/放大的圆心)
const PORT=[];                                            // {x,y,ch,fs,col:[r,g,b],a,kind,flk,fch} kind: silk/fig/gold/eye/name
function hex2rgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function buildPortrait(){
  PORT.length=0;
  const P=(x,y,ch,fs,hex,a,kind)=>PORT.push({x,y,ch,fs,col:hex2rgb(hex),a,kind:kind||'fig',flk:0,fch:''});
  /* 装裱:两侧绫绢 + 顶绫(变奏,勿全同) */
  for(let y=2.15;y<=7.0;y+=0.5){ P(SC.cx-SC.hw+0.06,y,(y*2|0)%2?'絹':'綾',0.19,COL.faint,0.32,'silk');
                                  P(SC.cx+SC.hw-0.06,y,(y*2|0)%2?'綾':'絹',0.19,COL.faint,0.32,'silk'); }
  { const top=[...'綾絹綾絹綾']; for(let k=-2;k<=2;k++) P(SC.cx+k*0.5,2.0,top[k+2],0.19,COL.faint,0.36,'silk'); }
  for(let i=0;i<10;i++) P(SC.cx+(rnd()-0.5)*2.0, 2.4+rnd()*4.4, '絹', 0.17, COL.ghost, 0.07+rnd()*0.05,'silk');
  /* 像主:肆·寫真 portrait() 同款侧影点集(无名的衣鬢字粒,正是肆里画的那张春容)。
     镜像(肆原面朝左)使其面朝右——望向拾画的柳夢梅;dy 线性映入轴内。独独没有瞳。 */
  const F=COL.fig,N=COL.near,G=COL.gold;
  const px=dx=>SC.cx-dx, py=dy=>2.35+(dy-1.64)*0.868;     // dx 镜像 · dy [1.64,7.00]→[2.35,7.0]
  const pts=[
    /* 鬢髮(髻绾于后) */
    [-0.34,2.20,'鬢',T7,N],[-0.14,2.06,'鬢',T7,N],[0.08,2.00,'鬢',T7,N],[0.28,2.04,'鬢',T7,N],
    [0.45,2.16,'鬢',T7,N],[0.53,2.37,'鬢',T7,N],[0.50,2.59,'鬢',T7,N],
    [0.16,1.78,'髻',T6,N],[0.40,1.87,'髻',T7,N],
    [0.04,1.64,'釵',T7,G],
    /* 眉鼻唇腮頸 */
    [-0.30,2.33,'眉',T7,F],
    [-0.45,2.65,'鼻',T7,F],[-0.36,2.84,'唇',T7,F],[0.01,2.77,'腮',T7,N],
    [-0.10,3.02,'頸',T7,F],[0.03,3.17,'頸',T8,N],
    /* 两袖(前袖微拢) */
    [-0.30,3.37,'袖',T6,F],[-0.50,3.63,'袖',T6,F],[-0.64,3.93,'袖',T6,F],[-0.72,4.25,'袖',T6,F],[-0.69,4.54,'袖',T7,N],
    [0.34,3.41,'袖',T6,F],[0.52,3.69,'袖',T6,F],[0.64,4.01,'袖',T6,F],[0.68,4.33,'袖',T6,F],[0.61,4.61,'袖',T7,N],
    /* 衣帶(胸前结至垂带) */
    [-0.05,3.66,'帶',T7,N],[-0.02,4.02,'帶',T7,N],[0.00,4.34,'帶',T6,F],
    [0.05,4.82,'帶',T7,N],[0.08,5.32,'帶',T7,N],[0.05,5.80,'帶',T8,N],
    /* 裙(两侧轮廓,A 字渐张) */
    [-0.48,4.66,'裙',T6,F],[-0.58,5.06,'裙',T6,F],[-0.68,5.46,'裙',T6,F],[-0.78,5.86,'裙',T6,F],[-0.88,6.26,'裙',T6,F],[-0.96,6.62,'裙',T6,F],
    [0.50,4.66,'裙',T6,F],[0.62,5.06,'裙',T6,F],[0.72,5.46,'裙',T6,F],[0.82,5.86,'裙',T6,F],[0.92,6.26,'裙',T6,F],[0.99,6.62,'裙',T6,F],

function paper(g,w,h){
  const bg=g.createLinearGradient(0,0,0,h); bg.addColorStop(0,'#0b1814'); bg.addColorStop(0.55,'#07100e'); bg.addColorStop(1,'#0b1814');
  g.fillStyle=bg; g.fillRect(0,0,w,h);
  for(const [fx,fy,fr,al] of [[0.5,0.42,0.6,0.05],[0.18,0.72,0.42,0.035],[0.84,0.34,0.42,0.04]]){
    const gr=g.createRadialGradient(w*fx,h*fy,0,w*fx,h*fy,Math.max(w,h)*fr); gr.addColorStop(0,`rgba(131,153,143,${al})`); gr.addColorStop(1,'rgba(131,153,143,0)'); g.fillStyle=gr; g.fillRect(0,0,w,h); }
  let g2=20260606>>>0; const r2=()=>{g2=(g2*1664525+1013904223)>>>0;return g2/4294967296;};
  g.save();
  const fibers=Math.max(30,Math.min(96,Math.round(Math.max(w,h)/24)));
  for(let i=0;i<fibers;i++){
    const x0=-w*0.08+r2()*w*1.04, y0=r2()*h, len=w*(0.18+r2()*0.52), bend=(r2()-0.5)*h*0.16;
    g.beginPath(); g.moveTo(x0,y0);
    g.bezierCurveTo(x0+len*0.28,y0+bend,x0+len*0.7,y0-bend*0.6,x0+len,y0+(r2()-0.5)*h*0.08);
    g.strokeStyle=`rgba(131,153,143,${(0.012+r2()*0.022).toFixed(3)})`;
    g.lineWidth=0.3+r2()*0.65; g.stroke();
  }
  const motes=Math.max(90,Math.min(360,Math.round(w*h/6200)));
  g.fillStyle='rgba(237,231,216,0.045)';
  for(let i=0;i<motes;i++){ const s=r2()<0.86?0.7:1.2; g.fillRect(r2()*w,r2()*h,s,s); }
  g.restore();
  for(let i=0;i<7;i++){ const x=r2()*w,y=r2()*h,rad=8+r2()*26; const gr=g.createRadialGradient(x,y,0,x,y,rad); gr.addColorStop(0,'rgba(237,231,216,0.045)'); gr.addColorStop(1,'rgba(237,231,216,0)'); g.fillStyle=gr; g.fillRect(x-rad,y-rad,rad*2,rad*2); }
  const v=g.createRadialGradient(w/2,h/2,Math.min(w,h)*0.34,w/2,h/2,Math.max(w,h)*0.74); v.addColorStop(0,'rgba(7,16,14,0)'); v.addColorStop(1,'rgba(7,16,14,0.55)'); g.fillStyle=v; g.fillRect(0,0,w,h);
}

const GONG=523.25;

const Sound={ ac:null, master:null, started:false, timers:[], mic:null, micBuf:null, micStream:null, micSource:null, micRequesting:false,
  start(){ if(this.started) return; this.started=true;
    try{

      const ac=this.ac=new AC(); const m=this.master=ac.createGain(); m.gain.value=0; m.connect(ac.destination);

    }catch(e){}
  },
  listen(){ const ac=this.ac;                              // 麦克风 RMS(参数同主作品 §2.5;file://或无麦静默退点击)
    if(this.micRequesting||!ac || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    this.micRequesting=true;
    let preferred=''; try{ preferred=localStorage.getItem('qg_mic')||''; }catch(e){}
    const request=audio=>navigator.mediaDevices.getUserMedia({audio});
    const pending=preferred?request({deviceId:{exact:preferred}}).catch(()=>request(true)):request(true);
    pending.then(ms=>{
      if(this.ac!==ac || calls>=3){ ms.getTracks().forEach(t=>t.stop()); return; }
      this.stopMic();
      const src=ac.createMediaStreamSource(ms), an=ac.createAnalyser(); an.fftSize=512;
      src.connect(an); this.micStream=ms; this.micSource=src; this.mic=an; this.micBuf=new Float32Array(an.fftSize);
      const ended=()=>{ if(this.micStream!==ms) return; this.stopMic(false);
        if(phase==='call') setHint('麥克風已離線 —— 可點畫像或按空格繼續喚'); };
      ms.getTracks().forEach(t=>t.addEventListener('ended',ended,{once:true}));
    }).catch(()=>{ this.stopMic(false); }).finally(()=>{ this.micRequesting=false; }); },
  stopMic(stopTracks=true){ const stream=this.micStream;
    this.micStream=null;
    try{ if(this.micSource) this.micSource.disconnect(); }catch(e){}
    try{ if(this.mic) this.mic.disconnect(); }catch(e){}
    this.micSource=null; this.mic=null; this.micBuf=null;

  rms(){ if(!this.mic) return 0; this.mic.getFloatTimeDomainData(this.micBuf);

    return Math.sqrt(s/this.micBuf.length); },

    if(this.ac){ try{ const p=this.ac.close(); if(p&&p.catch)p.catch(()=>{}); }catch(e){} } this.ac=null; this.started=false; },
  bell(freq,vol){ const ac=this.ac; if(!ac) return; const t=ac.currentTime;

    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+2.6);
    o.connect(g);o2.connect(g2);g2.connect(g);g.connect(this.master); o.start(t);o2.start(t);o.stop(t+2.7);o2.stop(t+2.7); },

/* ====== 园景字粒(凝定显真,照主作品 reveal 模式) ====== */
function drawItems(dt){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const revealK=revealStep(dt);
  let rockLit=0, rockTot=0;
  for(const it of items){
    if(it.wake!==undefined && !it.pop && gateT>=it.wake){                        // 波至即洇:款识字随涟漪抵岸,自叠加态被唤定
      it.pop=gateT; it.wakeRise=true; it.c=Math.max(it.c,0.3); Sound.bell(it.wakeF||GONG, 0.016); }  // 每字一缕极轻同律余响
    if(it.wakeRise){ it.c=Math.min(1,it.c+dt*1.9); if(it.c>=1){ it.wakeRise=false; it.cur=it.text; } }  // ~0.4s 如墨洇定,先颤后真
    let wxo=0, wyo=0, wgl=0;
    if(it.kx){ const dxv=it.x-SC.cx, dyv=it.y-SC.pcy, d=Math.hypot(dxv,dyv)||1e-4;   // 款识与画同摆:涟漪荡到右缘,引号匣与名俱晃
      for(const w of waves){ const vr=w.t*4.2, g=Math.exp(-(((d-vr)/0.55)**2));
        if(g>0.02){ wgl=Math.max(wgl,g); wxo+=dxv/d*g*0.09; wyo+=dyv/d*g*0.09; } } }
    const hsx=MX(it.x), hsy=MY(it.y); let infl=0;
    if(mouseOver && !endSt){ const dx=hsx-mouseX,dy=hsy-mouseY,d=Math.hypot(dx,dy); if(d<BRUSH){ const t=1-d/BRUSH; infl=t*t*(3-2*t); } }
    if(infl>it.c) it.c += (infl-it.c)*revealK;            // dt 归一:60Hz 时等效 0.12/帧
    const c=it.c;
    if(it.grp==='石'){ rockTot++; if(c>0.8) rockLit++; }
    if(!REDUCED_MOTION){
      it.flickT += dt*(1+(1-c)*7);
      if(it.flickT>it.flickEvery){ it.flickT=0; if(c<0.8) it.cur=randGlyphs(it.text.length); }
    }
    const txt=(c>=0.8)?it.text:it.cur;
    if(!REDUCED_MOTION){ it.ph1+=it.sp1*dt; it.ph2+=it.sp2*dt; }
    const amp=REDUCED_MOTION?0:(1-c)*it.jamp;
    const sx=MX(it.x+wxo+Math.cos(it.ph1)*amp), sy=MY(it.y+wyo+Math.sin(it.ph2)*amp*0.8);
    let fs=Math.max(6,(scale*it.size*(0.82+0.18*c))|0);
    if(it.pop){ const pk=Math.max(0,1-(gateT-it.pop)/0.55);                      // 洇:亮起缓胀一分,一拍落定(随墨洇放缓)
      if(pk>0) fs=(fs*(1+0.22*pk*pk))|0; }
    ctx.font=`${fs}px ${SERIF}`;
    const r=COLD[0]+(it.trgb[0]-COLD[0])*c, gg=COLD[1]+(it.trgb[1]-COLD[1])*c, b=COLD[2]+(it.trgb[2]-COLD[2])*c;
    let aa=0.14+(it.tA-0.14)*c;
    if(phase==='sweep'&&!juanOn&&it.grp==='石'&&it.size>=T4&&c<0.8)            // 所候之石呼吸提亮(照幕一语言):"那里有东西"的微光
      aa=Math.min(0.5, aa+(1-c)*(0.10+0.10*motionSin(gateT*2.6)));
    if(wgl>0) aa=Math.min(1, aa+wgl*0.25);                                     // 波过处微明:款识与画同一片水
    ctx.fillStyle=`rgba(${r|0},${gg|0},${b|0},${aa})`;
    if(c>0.25){ ctx.shadowColor='rgba(7,16,14,0.5)'; ctx.shadowBlur=fs*0.16*c; } else ctx.shadowBlur=0;
    if(it.pop && gateT-it.pop<1.4){ const gk=1-(gateT-it.pop)/1.4;             // 唤定余温:金晕渐冷,与磬之余响同衰
      ctx.shadowColor='rgba(210,174,104,0.75)'; ctx.shadowBlur=fs*0.55*gk*gk; }
    if(it.vert){ let y=sy-(txt.length-1)*fs/2; for(const ch of txt){ ctx.fillText(ch,sx,y); y+=fs; } }
    else ctx.fillText(txt,sx,sy);
  }
  ctx.shadowBlur=0;
  return {rockFrac: rockTot? rockLit/rockTot : 0};
}

/* ====== 「卷」:石中微露→显形可点 ====== */
function drawJuan(dt,rockFrac){
  if(phase!=='sweep'){ juanA=Math.max(0,juanA-dt*1.2); if(juanA<=0) return; }   // 展卷后,石上之卷随手隐去
  else if(juanOn) juanA=Math.min(1,juanA+dt/1.8);
  const fs=scale*0.5;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if(!juanOn){                                            // 中藏一角,微露:与叠加态同语言——游移+闪变,拂石渐稳
    if(!REDUCED_MOTION){ juanFlkT+=dt;
      if(juanFlkT>0.55){ juanFlkT=0; juanCur=(rockFrac>0.3||Math.random()<rockFrac*2)?'卷':(GPOOL[(Math.random()*GPOOL.length)|0]||'卷'); } }
    const sw=REDUCED_MOTION?0:(1-Math.min(1,rockFrac*3))*0.05;             // 石愈亮,卷愈定
    const jx=MX(JX+motionSin(gateT*0.8)*sw), jy=MY(JY+(REDUCED_MOTION?0:Math.cos(gateT*0.6))*sw*0.8);
    ctx.font=`${fs*0.8|0}px ${SERIF}`;
    ctx.fillStyle=`rgba(102,141,130,${(0.12+0.07*motionSin(gateT*2.6)).toFixed(3)})`;   // 减弱动效时冻结呼吸
    ctx.fillText(juanCur, jx, jy); return;
  }
  const jx=MX(JX), jy=MY(JY);
  const pulse=0.5+0.5*motionSin(gateT*2.2);
  const dk=ctx.createRadialGradient(jx,jy,0,jx,jy,fs*1.5);  // 暗底衬纸(出口同式):卷自石中让出一方白,不与石字相混
  dk.addColorStop(0,`rgba(7,16,14,${(0.60*juanA).toFixed(3)})`); dk.addColorStop(0.7,`rgba(7,16,14,${(0.32*juanA).toFixed(3)})`); dk.addColorStop(1,'rgba(7,16,14,0)');
  ctx.fillStyle=dk; ctx.fillRect(jx-fs*1.5,jy-fs*1.5,fs*3,fs*3);
  const g=ctx.createRadialGradient(jx,jy,0,jx,jy,fs*1.7);  // 金晕呼吸
  g.addColorStop(0,`rgba(210,174,104,${(0.05+pulse*0.07)*juanA})`); g.addColorStop(1,'rgba(210,174,104,0)');
  ctx.fillStyle=g; ctx.fillRect(jx-fs*1.7,jy-fs*1.7,fs*3.4,fs*3.4);
  ctx.font=`${fs|0}px ${SERIF}`;
  ctx.shadowColor='rgba(210,174,104,0.85)'; ctx.shadowBlur=fs*0.3*(0.4+0.6*pulse);
  ctx.fillStyle=`rgba(237,231,216,${(0.55+0.35*pulse)*juanA})`;
  ctx.fillText('卷', jx, jy); ctx.shadowBlur=0;
}

/* ====== 立轴 + 画像 ====== */
function drawScroll(dt){
  if(phase==='sweep') return;
  if(phase==='unroll'){ const pu=unrollT; unrollT+=dt;
    if(pu<1.3&&unrollT>=1.3) setHint('呀，一幅觀音喜相？');                    // 认画一拍(拾画原折:先认作观音)
    if(unrollT>=2.6){ phase='call'; setKeys('空格 喚一聲　·　R 重看本幕');
      setHint('觀音？嫦娥？—— 眉目宛然，卻少一雙瞳 · 喚三聲問她（出聲喚；或點畫像、空格）'); } }
  const op=phase==='unroll'?smooth(Math.min(1,unrollT/2.6)):1;
  const edge=SC.top+(SC.bot-SC.top)*op;
  /* 暗底衬纸(同出口式样,横向软边) */
  const x0=MX(SC.cx-SC.hw-0.24), x1=MX(SC.cx+SC.hw+0.24), y0=MY(SC.top-0.22), y1=MY(edge+0.2);
  const bg=ctx.createLinearGradient(x0,0,x1,0);
  bg.addColorStop(0,'rgba(7,16,14,0)'); bg.addColorStop(0.14,'rgba(7,16,14,0.55)');
  bg.addColorStop(0.86,'rgba(7,16,14,0.55)'); bg.addColorStop(1,'rgba(7,16,14,0)');
  ctx.fillStyle=bg; ctx.fillRect(x0,y0,x1-x0,y1-y0);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  /* 卷杆:展时下行,展尽即驻(两端軸、中段杆——同肆的轴杆语法,勿全同复贴) */
  { const rody=MY(edge+0.1), rfs=Math.max(8,scale*0.26|0), rod=[...'軸杆杆杆軸'];
    ctx.font=`${rfs}px ${SERIF}`; ctx.fillStyle='rgba(237,231,216,0.7)';
    for(let k=-2;k<=2;k++) ctx.fillText(rod[k+2], MX(SC.cx+k*0.56), rody); }
  /* 涟漪推进 */
  for(const w of waves) w.t+=dt;
  for(let i=waves.length-1;i>=0;i--) if(waves[i].t>2.2) waves.splice(i,1);
  /* 第三声荡到面门,瞳乃亮(门限按几何实算:像心到瞳距 ÷ 波速 4.2——点睛恰骑在波峰上) */
  if(calls>=3 && !eyesOn){ const w3=waves.find(w=>w.idx===3);
    const ey=PORT.find(p=>p.kind==='eye'), ed=ey?Math.hypot(ey.x-SC.cx,ey.y-SC.pcy)/4.2:0.25;
    if(!w3 || w3.t>ed) eyesOn=true; }
  warmCur += (warmTgt-warmCur)*Math.min(1,dt*1.1);
  if(eyesOn){ eyeT+=dt;
    if(!eyeBell && eyeT>0.55){ eyeBell=true; Sound.bell(GONG*LV.qshang,0.05); }  // 瞳亮时,一记轻清商
    if(phase==='call' && eyeT>1.0){ phase='awake'; awakeT=0;
      setHint('雙瞳亮了 —— 畫中人看見你了'); } }
  if(phase==='awake'){ awakeT+=dt;
    if(!gateReady && awakeT>2.4){ gateReady=true; Sound.bell(GONG,0.09);
      setKeys('→ 前行　·　R 重看本幕');
      setHint('軸下浮一「幽」字 —— 此去幽媾'); } }
  const awEase=phase==='awake'?smooth(Math.min(1,awakeT/2)):0;
  const sc=1+0.05*awEase;                                  // 半身前浮:整像放大 5%
  const breathe=phase==='awake'?(1+0.07*motionSin(awakeT*0.9)):1;   // 减弱动效时冻结呼吸
  const baseA=0.74+0.06*Math.min(calls,3);                 // 每唤一声,像色微明
  const wmix=0.32+0.68*warmCur;                            // 整像略冷→醒后回暖
  for(const P of PORT){
    if(P.kind==='eye' && !eyesOn) continue;
    if(P.kind==='name' && awEase<=0.02) continue;          // 名讳只在醒后浮显
    if(P.y>edge-0.05) continue;
    const fin=Math.min(1,(edge-P.y)/0.5);                  // 展开逐行渐显
    const isSilk=P.kind==='silk';                          // 装裱是死物:涟漪不推、苏醒不放大不呼吸——框死画活,方见"活了"
    let wb=0, dxo=0, dyo=0;
    if(!isSilk){ const dxv=P.x-SC.cx, dyv=P.y-SC.pcy, d=Math.hypot(dxv,dyv)||1e-4;
      for(const w of waves){ const vr=w.t*4.2, g=Math.exp(-(((d-vr)/0.55)**2));
        if(g>0.02){ wb=Math.max(wb,g); dxo+=dxv/d*g*0.09; dyo+=dyv/d*g*0.09; } } }
    if(P.flk>0) P.flk=REDUCED_MOTION?0:P.flk-dt;
    const scP=isSilk?1:sc, brP=isSilk?1:breathe;
    const px=SC.cx+(P.x+dxo-SC.cx)*scP, py=SC.pcy+(P.y+dyo-SC.pcy)*scP;
    const fs=Math.max(6,(scale*P.fs*scP)|0);
    ctx.font=`${fs}px ${SERIF}`;
    if(P.kind==='name'){                                   // 醒:金色小号「麗娘」自心口浮显——画中人有了名字
      const na=awEase*P.a*(0.85+0.15*motionSin(gateT*1.1));
      ctx.shadowColor='rgba(210,174,104,0.6)'; ctx.shadowBlur=fs*0.3;
      ctx.fillStyle=`rgba(210,174,104,${na.toFixed(3)})`;
      ctx.fillText(P.ch, MX(px), MY(py-0.14*awEase)); ctx.shadowBlur=0; continue;
    }
    if(P.kind==='eye'){                                    // 双瞳:全场最亮,小小光晕(画中人睁眼)
      const ea=Math.min(1,eyeT/0.8), tw=0.85+0.15*motionSin(gateT*1.4);
      const hg=ctx.createRadialGradient(MX(px),MY(py),0,MX(px),MY(py),fs*1.8);
      hg.addColorStop(0,`rgba(210,174,104,${(0.13*ea*tw).toFixed(3)})`); hg.addColorStop(1,'rgba(210,174,104,0)');
      ctx.fillStyle=hg; ctx.fillRect(MX(px)-fs*1.8,MY(py)-fs*1.8,fs*3.6,fs*3.6);
      ctx.shadowColor='rgba(210,174,104,0.9)'; ctx.shadowBlur=fs*0.55;
      ctx.fillStyle=`rgba(237,231,216,${(ea*tw).toFixed(3)})`;
      ctx.fillText('瞳', MX(px), MY(py)); ctx.shadowBlur=0; continue;
    }
    const ch=P.flk>0?P.fch:P.ch;
    if(P.key && eyesOn){                                   // 谶字「柳」「梅」与瞳同亮:同一道点睛的光,落回诗里
      const ea=Math.min(1,eyeT/0.8), tw=0.85+0.15*motionSin(gateT*1.4);
      ctx.shadowColor='rgba(210,174,104,0.7)'; ctx.shadowBlur=fs*0.45*ea;
      ctx.fillStyle=`rgba(210,174,104,${(Math.min(1,P.a*baseA*fin)*(1-ea)+ea*0.92*tw).toFixed(3)})`;
      ctx.fillText(ch, MX(px), MY(py)); ctx.shadowBlur=0; continue;
    }
    const r=COLD[0]+(P.col[0]-COLD[0])*wmix, g2=COLD[1]+(P.col[1]-COLD[1])*wmix, b2=COLD[2]+(P.col[2]-COLD[2])*wmix;
    const a=Math.min(1, P.a*baseA*fin*brP + wb*0.30);
    ctx.fillStyle=`rgba(${r|0},${g2|0},${b2|0},${a.toFixed(3)})`;
    if(P.kind==='gold'){ ctx.shadowColor='rgba(210,174,104,0.5)'; ctx.shadowBlur=fs*0.2; }
    else { ctx.shadowColor='rgba(7,16,14,0.5)'; ctx.shadowBlur=fs*0.12; }
    ctx.fillText(ch, MX(px), MY(py));
  }
  ctx.shadowBlur=0;
}

/* ====== 出口「幽」(gateA 模式,照主作品) ====== */
function drawGate(dt){
  gateA=Math.min(1,gateA+dt/2.6);
  const R=Math.min(W,H)*0.078, pulse=0.5+0.5*motionSin(gateT*2.2);
  const cx=MX(8), cy=MY(8.18);
  ctx.save(); ctx.globalAlpha=gateA;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const dg=ctx.createRadialGradient(cx,cy,0,cx,cy,R*1.3);   // 1.3:暗衬勿上侵轴杆行(軸/幽/hint/南墙挤不下 1.7)
  dg.addColorStop(0,'rgba(7,16,14,0.62)'); dg.addColorStop(0.66,'rgba(7,16,14,0.36)'); dg.addColorStop(1,'rgba(7,16,14,0)');
  ctx.fillStyle=dg; ctx.fillRect(cx-R*1.3,cy-R*1.3,R*2.6,R*2.6);
  const fs=R*0.95;
  ctx.font=`${fs|0}px ${SERIF}`;
  ctx.shadowColor='rgba(210,174,104,0.85)'; ctx.shadowBlur=fs*0.3*(0.4+0.6*pulse);
  ctx.fillStyle=`rgba(237,231,216,${0.62+0.32*pulse})`;
  ctx.fillText('幽', cx, cy); ctx.shadowBlur=0;
  ctx.restore();
  passX=cx; passY=cy; passR=R*1.6;
}

/* ====== 进程 ====== */
function checkSweep(st){
  if(!juanOn){
    if(st.rockFrac>=0.55){ juanOn=true; Sound.bell(GONG*LV.jue,0.07);            // 卷显一记(角)
      setHint('苔色掃處，石中露出一角畫卷 —— 點「卷」，拾畫'); return; }
    const pc=Math.round(st.rockFrac*100);
    if(pc!==lastProg && pc>0){ lastProg=pc;                                      // pc>0 才接管:开场"園角太湖石下"的位置线索勿被一帧吃掉
      setHint('園角太湖石下 · 以指拂石，掃去苔色 —— '+['苔色未動','拂亮一成','拂亮二成','拂亮三成','拂亮四成','拂亮五成','將見其物'][Math.min(6,Math.floor(pc/10))]); }
  }
}
function startUnroll(){
  if(phase!=='sweep' || !juanOn) return;
  phase='unroll'; unrollT=0; Sound.bell(GONG,0.09);                              // 展卷一记(宫)
  setHint('立軸自上而下，徐徐展開 ——');
}
function doCall(){
  if(phase!=='call' || calls>=3) return;
  if(gateT-lastCall<0.85) return; lastCall=gateT;
  calls++; waves.push({t:0, idx:calls});
  const f=[LV.yu, LV.qgong, LV.qshang][calls-1];                                 // 三声上行:羽→清宫→清商
  Sound.bell(GONG*f, 0.10);
  { const hu=items.filter(it=>it.grp==='呼'),                                    // 声落字显:涟漪真荡到纸边——按像心→字位的波程定时,波至即绽
        rg=[[0,2],[2,4],[4,8]][calls-1];
    for(let i=rg[0];i<rg[1]&&i<hu.length;i++){ const it=hu[i];
      it.wake=gateT + Math.hypot(it.x-SC.cx, it.y-SC.pcy)/4.2 + (i-rg[0])*0.13;  // 同匣字再错半拍,如墨次第洇开
      it.wakeF=GONG*[LV.yu,LV.qgong,LV.qshang][calls-1]; } }
  if(calls===1){ warmTgt=0.5;  setHint('第一聲「美人」—— 像色微明 · 再喚'); }
  else if(calls===2){ warmTgt=0.62;
    for(const P of PORT){ if(P.kind!=='eye'&&P.kind!=='name'){ P.flk=0.32; P.fch=GPOOL[(Math.random()*GPOOL.length)|0]; } }  // 满纸字粒齐齐闪变一轮
    setHint('第二聲「美人」—— 滿紙字粒俱顫 · 再喚'); }
  else { warmTgt=1; setHint('第三聲「姐姐，姐姐」——'); }
  if(calls===3) Sound.stopMic();
}
function tryCall(){                                                              // 点击/空格入口:不应期被吞也给最轻一档回应(金环一闪,不出声)
  const b=calls; doCall();
  if(phase==='call' && calls===b && calls<3) ackT=0.22;
}
function advance(){
  if(endSt || !gateReady) return;
  endSt={t:0}; Sound.bell(GONG/2,0.1);                                           // 入幽一记(低宫)
}

/* ====== 主循环 ====== */
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; gateT+=dt;
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  if(paperCv) ctx.drawImage(paperCv,0,0,W,H);
  const st=drawItems(dt);
  if(phase==='sweep' && !endSt) checkSweep(st);
  if(phase==='call' && !endSt){                            // 出声唤:RMS 瞬时 0.10 立即 / 持续 0.045 累积 0.22s(无麦恒 0,自动退点击)
    const r=Sound.rms();
    if(r>0.10) doCall();
    else if(r>0.045){ voiceT+=dt; if(voiceT>0.22){ voiceT=0; doCall(); } }
    else voiceT=0; }
  drawJuan(dt,st.rockFrac);
  drawScroll(dt);
  if(gateReady && !endSt) drawGate(dt);
  if(mouseOver && !endSt){                                 // 自绘指针:柔光圈+小金环;近可点目标时变亮变大
    const g=ctx.createRadialGradient(mouseX,mouseY,0,mouseX,mouseY,BRUSH*0.62);
    g.addColorStop(0,'rgba(237,231,216,0.12)'); g.addColorStop(0.6,'rgba(237,231,216,0.04)'); g.addColorStop(1,'rgba(237,231,216,0)');
    ctx.fillStyle=g; ctx.fillRect(mouseX-BRUSH,mouseY-BRUSH,BRUSH*2,BRUSH*2);
    let near=false;
    if(phase==='sweep'&&juanOn&&juanA>0.3) near=Math.hypot(mouseX-MX(JX),mouseY-MY(JY))<Math.max(40,scale*0.55);
    if(phase==='call') near = inScrollClick(mouseX,mouseY);
    if(gateReady && Math.hypot(mouseX-passX,mouseY-passY)<passR) near=true;
    ackT=Math.max(0,ackT-dt); const ack=ackT/0.22;         // 被吞点击的回应:"收到了,且慢"
    ctx.strokeStyle=`rgba(210,174,104,${Math.min(1,(near?0.85:0.28)+ack*0.4)})`; ctx.lineWidth=(near?1.4:1)+ack*0.8;
    ctx.beginPath(); ctx.arc(mouseX,mouseY,near?13:9,0,TAU); ctx.stroke();
    if(near){ ctx.fillStyle='rgba(210,174,104,0.5)'; ctx.beginPath(); ctx.arc(mouseX,mouseY,2,0,TAU); ctx.fill(); }
  }
  if(endSt){                                               // 终幕:暗下→题字→淡出回开场
    endSt.t+=dt;
    const a=Math.min(1,endSt.t/1.4);
    ctx.fillStyle=`rgba(7,16,14,${(a*0.94).toFixed(3)})`; ctx.fillRect(0,0,W,H);
    const ta=endSt.t<3.4?Math.max(0,Math.min(1,(endSt.t-0.9)/0.8)):Math.max(0,1-(endSt.t-3.4)/0.9);
    if(ta>0){ ctx.textAlign='center'; ctx.textBaseline='middle';
      const fs=Math.min(W,H)*0.045;
      ctx.font=`${fs|0}px ${SERIF}`; ctx.fillStyle=`rgba(237,231,216,${(ta*0.9).toFixed(3)})`;
      ctx.fillText('本幕終 —— 拾畫·叫畫', W/2, H/2-fs*0.4);
      ctx.font=`${fs*0.5|0}px ${SERIF}`; ctx.fillStyle=`rgba(210,174,104,${(ta*0.6).toFixed(3)})`;
      ctx.fillText('此 去 幽 媾', W/2, H/2+fs*0.9);
      ctx.font=`${fs*0.42|0}px ${SERIF}`; ctx.fillStyle=`rgba(210,174,104,${(ta*0.5).toFixed(3)})`;
      ctx.fillText('只有愛，完成測量', W/2, H/2+fs*1.9); }                       // 题旨随观众离场,不在入场剧透
    if(endSt.t>3.4 && !endSt.veiled){ endSt.veiled=true;                         // 遮罩提前唤回:1.6s 淡入在黑纱(0.94)底下完成——门缓缓显形,永不闪现
      document.getElementById('enter').classList.remove('gone'); }
    if(endSt.t>4.5 && !endSt.went){ endSt.went=true; location.href='../量子游园·丙·交互体验.html?act=3'; }   // 八幕链:幽→糾纏橋(主作品第四幕)
  }
  requestAnimationFrame(frame);
}

/* ====== 尺寸 / 入园 / 事件 ====== */
function resizeLayout(){
  W=window.innerWidth; H=window.innerHeight;
  DPR=Math.max(.5,Math.min(window.devicePixelRatio||1,2,Math.sqrt(8000000/Math.max(1,W*H))));
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  scale=Math.min(W/VW,H/VH)*0.95; ox=(W-VW*scale)/2; oy=(H-VH*scale)/2;
  BRUSH=Math.min(W,H)*0.2; buildPaper();
}
function inScrollClick(x,y){                               // 叫画:点画像(立轴一带从宽认定)
  const vx=(x-ox)/scale, vy=(y-oy)/scale;
  return vx>SC.cx-SC.hw-0.9 && vx<SC.cx+SC.hw+0.9 && vy>SC.top-0.4 && vy<SC.bot+0.5;
}
window.addEventListener('resize', resizeLayout);
function updatePointer(e){ mouseX=e.clientX; mouseY=e.clientY; mouseOver=true; }
function clearPointer(){ mouseX=-1e4; mouseY=-1e4; mouseOver=false; }
function clearTouchPointer(e){ if(e.pointerType==='touch') clearPointer(); }
cv.addEventListener('pointermove', updatePointer);
cv.addEventListener('pointerleave', clearPointer);
cv.addEventListener('pointerdown', e=>{
  updatePointer(e);
  if(endSt) return;
  if(gateReady && Math.hypot(e.clientX-passX,e.clientY-passY)<passR){ advance(); return; }
  if(phase==='sweep' && juanOn && juanA>0.3 &&
     Math.hypot(e.clientX-MX(JX),e.clientY-MY(JY))<Math.max(40,scale*0.55)){ startUnroll(); return; }
  if(phase==='call' && inScrollClick(e.clientX,e.clientY)){ tryCall(); return; }
});
cv.addEventListener('pointerup', clearTouchPointer);
cv.addEventListener('pointercancel', clearTouchPointer);
function enter(){ const e=document.getElementById('enter'); if(e.classList.contains('gone')) return;
  e.classList.add('gone'); e.setAttribute('aria-hidden','true');
  const enterBtn=document.getElementById('enterBtn'); enterBtn.disabled=true; enterBtn.blur();
  document.getElementById('keys').classList.add('show');
  Sound.start(); setTimeout(()=>Sound.bell(GONG*LV.jue,0.055),340);   // 入幕一记磬(角)
  setHint('〔陸〕拾畫·叫畫 · 園角太湖石下，似有一角微露 —— 以指拂石，掃去苔色'); }
document.getElementById('enterBtn').addEventListener('click', enter);
document.getElementById('replay').addEventListener('click', e=>{ e.stopPropagation(); loadScene(); });
window.addEventListener('keydown', ev=>{
  if(ev.repeat) return;
  const entered=document.getElementById('enter').classList.contains('gone');
  if(ev.code==='Space'||ev.key==='Enter'){ ev.preventDefault(); if(!entered) enter(); else if(ev.code==='Space') tryCall(); }
  if(ev.key==='ArrowRight' && entered && gateReady) advance();
  if(ev.key==='r'||ev.key==='R'){ if(entered) loadScene(); }
});

/* ====== 调试探针(headless 截图验证用;不影响正常体验) ====== */
window.__qg={
  enter,
  s1(){ enter(); for(const it of items) if(it.grp==='石'){ it.c=1; it.cur=it.text; }
        juanOn=true; juanA=1; setHint('苔色掃處，石中露出一角畫卷 —— 點「卷」，拾畫'); },

        setHint('觀音？嫦娥？—— 眉目宛然，卻少一雙瞳 · 喚三聲問她（出聲喚；或點畫像、空格）'); },
  s3(){ this.s2(); calls=3; warmCur=1; warmTgt=1; eyesOn=true; eyeT=2; eyeBell=true;
        for(const it of items) if(it.grp==='呼'){ it.c=1; it.cur=it.text; }
        phase='awake'; awakeT=3; gateReady=true; gateA=1; setKeys('→ 前行　·　R 重看本幕');
        setHint('軸下浮一「幽」字 —— 此去幽媾'); },
  call:doCall, state(){ return {phase,calls,juanOn,eyesOn,gateReady}; }
};

resizeLayout();
loadScene();
requestAnimationFrame(frame);
let journeyActive=false; try{ journeyActive=new URLSearchParams(location.search).get('debug')!=='1'&&sessionStorage.getItem('qg_journey_active')==='1'; }catch(e){}
if(journeyActive){ document.getElementById('enter').classList.add('journey');
  setTimeout(enter,REDUCED_MOTION?240:2200); }
window.addEventListener('pagehide',()=>Sound.stop(),{once:true});

/* ====== 全屏沉浸(2026-06-13 一葳):右上角可见入口「全屏」+ 入园自动 + F 键;装在 沉浸.html 外壳(iframe)里时,全屏整个外壳——跨幕换页不掉全屏 ====== */
(function(){
  var framed=false; try{ framed = (window.self!==window.top) && !!window.top.document; }catch(e){ framed=false; }
  function fsDoc(){ try{ return framed?window.top.document:document; }catch(e){ return document; } }
  function fsEl(){ try{ return framed?window.top.document.documentElement:document.documentElement; }catch(e){ return document.documentElement; } }
  function isFS(){ try{ return !!fsDoc().fullscreenElement; }catch(e){ return false; } }
  function canFS(){ try{ const doc=fsDoc(), el=fsEl(), pol=doc.permissionsPolicy||doc.featurePolicy; return doc.fullscreenEnabled===true && !!el.requestFullscreen && !(typeof navigator!=='undefined'&&navigator.webdriver) && !(pol&&pol.allowsFeature&&pol.allowsFeature('fullscreen')===false); }catch(e){ return false; } }
  function reqFS(){ try{ if(!isFS()&&canFS()){ const p=fsEl().requestFullscreen(); if(p&&p.catch)p.catch(()=>{}); } }catch(_){} }
  function exitFS(){ try{ if(isFS()){ const p=fsDoc().exitFullscreen(); if(p&&p.catch)p.catch(()=>{}); } }catch(_){} }
  var btn=document.createElement('button'); btn.type='button'; btn.id='fsBtn'; btn.textContent='⛶';
  btn.setAttribute('aria-label','全屏'); btn.setAttribute('aria-pressed','false'); btn.title='全屏';
  btn.style.cssText='position:fixed;top:14px;right:16px;z-index:50;'
    +'display:grid;place-items:center;width:44px;height:44px;min-width:44px;min-height:44px;'
    +'font-family:"Songti SC","STSong","SimSun",serif;font-size:22px;letter-spacing:0;'
    +'color:#83998f;opacity:.72;cursor:pointer;padding:0;'
    +'border:1px solid rgba(131,153,143,.3);border-radius:3px;background:rgba(11,24,20,.42);'
    +'transition:.25s;user-select:none;pointer-events:auto';
  btn.onmouseenter=function(){ btn.style.color='#d2ae68'; btn.style.borderColor='rgba(210,174,104,.65)'; btn.style.opacity='1'; };
  btn.onmouseleave=function(){ btn.style.color='#83998f'; btn.style.borderColor='rgba(131,153,143,.3)'; btn.style.opacity='.72'; };
  function toggle(e){ if(e){ e.stopPropagation(); e.preventDefault(); } isFS()?exitFS():reqFS(); }
  btn.addEventListener('click', toggle);
  function syncLabel(){ const active=isFS(); btn.setAttribute('aria-pressed',String(active)); btn.setAttribute('aria-label',active?'退出全屏':'全屏'); btn.title=active?'退出全屏':'全屏'; }
  document.addEventListener('fullscreenchange', syncLabel);
  var topDoc=null;
  try{ if(framed){ topDoc=window.top.document; topDoc.addEventListener('fullscreenchange', syncLabel); } }catch(e){ topDoc=null; }
  function cleanup(){ document.removeEventListener('fullscreenchange',syncLabel);
    if(topDoc) topDoc.removeEventListener('fullscreenchange',syncLabel); }
  addEventListener('pagehide',cleanup,{once:true});
  function mount(){ (document.body||document.documentElement).appendChild(btn); }
  if(document.body) mount(); else addEventListener('DOMContentLoaded', mount);
  /* 入园那一下顺手全屏(展览触屏);失败也无妨,右上角按钮兜底 */
  var auto=false; function autoFS(){ if(auto) return; auto=true; reqFS(); }
  const enterEl=document.getElementById('enter'), enterButton=document.getElementById('enterBtn');
  if(enterButton) enterButton.addEventListener('pointerdown', function(){ autoFS(); }, {capture:true, once:true});
  addEventListener('keydown', function(e){
    if(e.repeat) return;
    if(e.key==='f'||e.key==='F'){ toggle(e); return; }
    if(!auto && enterEl&&!enterEl.classList.contains('gone') && (e.code==='Space'||e.key==='Enter')) autoFS();
  }, {capture:true});
})();

</script>
