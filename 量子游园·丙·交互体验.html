<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>量子游园 · 观之即显</title>
<script>
  (()=>{ const q=new URLSearchParams(location.search);
    let show=q.get('prelude')==='1'||(!q.has('act')&&q.get('debug')!=='1'&&q.get('setup')!=='1');
    try{ if(q.get('prelude')!=='1'&&sessionStorage.getItem('qg_journey_active')==='1') show=false; }catch(_){}
    if(show) document.documentElement.classList.add('qg-prelude');
  })();
</script>
<style>
  :root{
    --serif:"Songti SC","STSong","SimSun",serif;
    --sans:-apple-system,"PingFang SC",system-ui,sans-serif;
    --night:#07100e; --ink:#0b1814; --mist:#83998f; --bone:#ede7d8;
    --gold:#d2ae68; --cinnabar:#c66858; --water:#668d82;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--night)}
  body{font-family:var(--sans);color:var(--bone);user-select:none}
  button{font:inherit}
  button:focus-visible{outline:1px solid var(--cinnabar);outline-offset:4px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  #scene{position:fixed;inset:0;display:block;cursor:none;z-index:1;touch-action:none}

  /* 幕内 UI 是园林的题跋：幕标左上、口诀左下、工具右上。 */
  .ui{position:fixed;inset:0;pointer-events:none;z-index:5;font-family:var(--serif);visibility:hidden}
  body.in .ui{visibility:visible}
  .ui::after{content:"";position:absolute;left:0;right:0;bottom:0;height:132px;z-index:-1;
    background:linear-gradient(180deg,rgba(7,16,14,0),rgba(7,16,14,.9) 68%,rgba(7,16,14,.98))}
  .act-mark{position:absolute;top:32px;left:32px;display:grid;grid-template-columns:auto auto;align-items:baseline;
    column-gap:12px;row-gap:8px;color:var(--bone);text-shadow:0 1px 18px rgba(0,0,0,.75)}
  .act-mark .no{font-size:12px;letter-spacing:0;color:var(--cinnabar)}
  .act-mark .name{font-size:18px;letter-spacing:0}
  .act-mark .phase{grid-column:2;font-family:var(--sans);font-size:11px;letter-spacing:0;color:var(--mist)}
  .act-mark::after{content:"";position:absolute;left:0;top:34px;width:1px;height:24px;background:rgba(198,104,88,.72)}
  .prompt{position:absolute;left:32px;bottom:32px;width:min(620px,calc(100vw - 160px));min-height:92px;padding:0 20px 2px 16px;
    border-left:1px solid rgba(198,104,88,.72);text-shadow:0 1px 18px rgba(0,0,0,.86)}
  .prompt::after{content:"";position:absolute;z-index:-1;left:-32px;right:-28px;top:-24px;bottom:-24px;
    background:linear-gradient(90deg,rgba(7,16,14,.92),rgba(7,16,14,.66) 72%,rgba(7,16,14,0));pointer-events:none}
  .prompt .label{display:block;margin-bottom:7px;font-family:var(--sans);font-size:11px;letter-spacing:0;color:var(--cinnabar)}
  .hint-title{display:none;margin-bottom:6px;font-size:17px;line-height:1.45;color:var(--gold);font-weight:400}
  .hint-title.show{display:block}
  .ui .hint{font-size:14px;line-height:1.72;color:var(--bone);opacity:0;transition:opacity .22s ease}
  .ui .hint.show{opacity:.94}
  .hint-action{display:none;margin-top:8px;font-family:var(--sans);font-size:11px;line-height:1.6;color:var(--mist)}
  .hint-action.show{display:block}
  .hint-action::before{content:"→";margin-right:7px;color:var(--cinnabar)}
  .toolrail{position:absolute;top:24px;right:24px;display:flex;gap:4px;pointer-events:auto}
  .tool{position:relative;width:44px;height:44px;border:0;border-radius:0;background:transparent;color:var(--mist);
    display:grid;place-items:center;cursor:pointer;opacity:.76;transition:color .14s ease,opacity .14s ease,background-color .14s ease}
  .tool::after{content:"";position:absolute;left:12px;right:12px;bottom:5px;height:1px;background:currentColor;opacity:0;transform:scaleX(.35);transition:.14s ease}
  .tool:hover,.tool[data-active="true"]{color:var(--cinnabar);opacity:1;background:rgba(7,16,14,.42)}
  .tool:hover::after,.tool[data-active="true"]::after{opacity:.8;transform:scaleX(1)}
  .tool .glyph{font-size:18px;line-height:1}
  .tool-gaze{width:auto;grid-auto-flow:column;column-gap:7px;padding:0 10px}
  .tool-gaze .glyph{font-size:16px}
  .tool-gaze .tool-label{font-family:var(--serif);font-size:12px;line-height:1;white-space:nowrap}
  #redream .glyph,#reenter .glyph{font-family:var(--sans);font-size:20px}
  .keys{position:absolute;right:28px;bottom:24px;font-family:var(--sans);font-size:11px;letter-spacing:0;
    color:var(--mist);opacity:0;transition:opacity .22s ease}
  .keys.show{opacity:.76}

  /* 预备幕只在完整旅程首次出现；测试直入与回环续游不重复询问。 */
  #prelude{display:none;position:fixed;inset:0;z-index:12;align-items:center;justify-content:center;flex-direction:column;
    padding:48px 24px;background:var(--night);font-family:var(--serif);text-align:center;transition:opacity .7s ease,visibility .7s ease}
  .qg-prelude #prelude{display:flex}
  #prelude::before{content:"";position:absolute;inset:24px;border:1px solid rgba(131,153,143,.14);pointer-events:none}
  #prelude.gone{opacity:0;visibility:hidden;pointer-events:none}
  #prelude .eyebrow{margin-bottom:18px;font-family:var(--sans);font-size:11px;color:var(--cinnabar)}
  #prelude .big{font-size:clamp(38px,6vw,68px);line-height:1.15;color:var(--bone);text-shadow:0 2px 34px rgba(0,0,0,.82)}
  #prelude .story{margin-top:22px;max-width:720px;font-size:16px;line-height:1.9;color:var(--bone);opacity:.9}
  #prelude .question{margin-top:28px;font-family:var(--sans);font-size:12px;color:var(--gold)}
  .mode-options{display:grid;grid-template-columns:1fr 1fr;width:min(780px,calc(100vw - 48px));margin-top:14px;
    border-top:1px solid rgba(198,104,88,.52);border-bottom:1px solid rgba(198,104,88,.52)}
  .mode-option{min-width:0;min-height:116px;padding:18px 24px;border:0;border-radius:0;background:transparent;color:var(--bone);
    display:grid;grid-template-columns:40px 1fr;align-items:center;column-gap:14px;text-align:left;cursor:pointer;transition:background-color .18s ease,color .18s ease,opacity .18s ease}
  .mode-option+.mode-option{border-left:1px solid rgba(131,153,143,.24)}
  .mode-option:hover,.mode-option:focus-visible{background:rgba(131,153,143,.09);color:#fff}
  .mode-option .icon{grid-row:1 / span 2;font-size:24px;color:var(--cinnabar);text-align:center}
  .mode-option .name{align-self:end;font-size:18px;color:var(--bone)}
  .mode-option .detail{align-self:start;margin-top:7px;font-family:var(--sans);font-size:12px;line-height:1.65;color:var(--mist)}
  #prelude .note{margin-top:16px;font-family:var(--sans);font-size:11px;line-height:1.6;color:var(--mist)}
  #prelude .waiting{display:none;margin-top:28px;font-family:var(--sans);font-size:12px;line-height:1.8;color:var(--gold)}
  #prelude .waiting button{display:block;margin:14px auto 0;min-height:40px;padding:0 18px;border:0;border-top:1px solid rgba(198,104,88,.6);
    border-bottom:1px solid rgba(198,104,88,.6);border-radius:0;background:transparent;color:var(--bone);cursor:pointer}
  #prelude.is-waiting .mode-options,#prelude.is-waiting .question,#prelude.is-waiting .note{display:none}
  #prelude.is-waiting .waiting{display:block}

  /* 第一幕报幕在预备幕选择之后出现；全作品片头由沉浸外壳负责。 */
  #enter{position:fixed;inset:0;z-index:9;background:rgba(7,16,14,.94);display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:48px 24px;font-family:var(--serif);cursor:none;transition:opacity .7s ease}
  #enter::before{content:"";position:absolute;inset:24px;border:1px solid rgba(131,153,143,.12);pointer-events:none}
  #enter:focus-visible{outline:1px solid var(--cinnabar);outline-offset:-8px}
  #enter.gone{opacity:0;pointer-events:none}
  #enter.calibration-suspended{opacity:0;visibility:hidden;pointer-events:none}
  #enter.mode-report{pointer-events:none}
  #enter .eyebrow{margin-bottom:20px;font-family:var(--sans);font-size:11px;letter-spacing:0;color:var(--cinnabar)}
  #enter .sub{margin-bottom:14px;font-size:13px;line-height:1.5;color:var(--gold);opacity:0;transition:opacity .6s ease}
  #enter .big{font-size:clamp(36px,6vw,64px);line-height:1.15;letter-spacing:0;color:var(--bone);
    text-shadow:0 2px 34px rgba(0,0,0,.84);opacity:0;filter:blur(8px);transform:translateY(8px);
    transition:opacity 1.1s ease,filter 1.1s ease,transform 1.1s ease}
  #enter .big.revealed{opacity:1;filter:blur(0);transform:none}
  #enter .story{margin-top:24px;max-width:640px;font-size:16px;line-height:1.9;color:var(--bone);opacity:0;text-align:center;transition:opacity .6s ease}
  #enter .legend{margin-top:16px;max-width:560px;text-align:center;font-size:13px;line-height:1.8;color:var(--mist);opacity:0;transition:opacity .6s ease}
  #enter .legend .lh,#enter .legend .item i{display:none}
  #enter .legend .item{display:block;margin:0}
  #enter .legend em{font-style:normal;color:var(--mist)}
  #enter .blink{margin-top:40px;min-height:48px;padding:0 24px;display:flex;align-items:center;border-top:1px solid rgba(198,104,88,.65);
    border-bottom:1px solid rgba(198,104,88,.65);font-family:var(--sans);font-size:13px;letter-spacing:0;color:var(--bone);opacity:0}
  #enter .blink.go{opacity:1;animation:entrymark 2.4s ease-in-out infinite}
  #enter.journey .blink{display:none}
  @keyframes entrymark{0%,100%{border-color:rgba(198,104,88,.38);color:rgba(237,231,216,.62)}50%{border-color:rgba(198,104,88,.92);color:var(--bone)}}

  #actcard{position:fixed;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:48px 24px;pointer-events:none;background:rgba(7,16,14,.94);font-family:var(--serif);opacity:0;visibility:hidden;
    transition:opacity .55s ease,visibility .55s ease}
  #actcard.show{opacity:1;visibility:visible;pointer-events:auto}
  #actcard .ace{margin-bottom:20px;font-family:var(--sans);font-size:11px;color:var(--cinnabar)}
  #actcard .acno{margin-bottom:14px;font-size:13px;color:var(--gold)}
  #actcard .acn{font-size:clamp(36px,6vw,64px);letter-spacing:0;color:var(--bone);text-shadow:0 2px 24px rgba(0,0,0,.86)}
  #actcard .acs{margin-top:24px;max-width:640px;font-size:16px;line-height:1.9;color:var(--bone);text-align:center;text-shadow:0 1px 16px rgba(0,0,0,.82)}
  #actcard .aci{margin-top:16px;max-width:560px;font-size:13px;line-height:1.8;color:var(--mist);text-align:center}

  /* 封面光标是未闭合的观测环；入园后交给 Canvas 同形光标。 */
  #curcur{position:fixed;left:0;top:0;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;pointer-events:none;
    z-index:60;opacity:0;transition:opacity .2s ease;background:radial-gradient(circle,rgba(237,231,216,.08),transparent 62%)}
  #curcur::before,#curcur::after{content:"";position:absolute;inset:12px;border:1px solid transparent;border-radius:50%}
  #curcur::before{border-top-color:rgba(198,104,88,.9);border-left-color:rgba(198,104,88,.9);transform:rotate(-18deg)}
  #curcur::after{inset:21px;background:var(--cinnabar);border:0}
  #curcur.on{opacity:1}
  #fsBtn{visibility:hidden}
  body.in #fsBtn{visibility:visible}
  body.gaze-calibrating .ui{visibility:visible}
  body.gaze-calibrating #fsBtn{visibility:visible}
  body.gaze-calibrating .act-mark,body.gaze-calibrating .keys{visibility:hidden!important}
  body.gaze-calibrating .toolrail{visibility:visible!important}
  body.gaze-calibrating .toolrail .tool:not(#gaze),body.gaze-calibrating #redreamgap{display:none!important}
  body.gaze-calibrating .prompt{left:50%;bottom:18px;width:min(720px,calc(100vw - 32px));transform:translateX(-50%);text-align:center;border-left:0;padding-left:0}

  @media (max-width:720px){
    #prelude{padding:36px 20px}
    #prelude::before{inset:12px}
    #prelude .story{font-size:14px;max-width:340px}
    #prelude .question{margin-top:20px}
    .mode-options{grid-template-columns:1fr;width:min(420px,calc(100vw - 40px))}
    .mode-option{min-height:88px;padding:12px 16px}
    .mode-option+.mode-option{border-left:0;border-top:1px solid rgba(131,153,143,.24)}
    #enter{padding:40px 20px}
    #enter::before{inset:12px}
    #enter .eyebrow{margin-bottom:16px}
    #enter .big{font-size:48px;letter-spacing:0}
    #enter .story{margin-top:24px;font-size:15px;max-width:340px}
    #enter .legend{font-size:12px;max-width:320px}
    #enter .blink{margin-top:32px}
    .act-mark{top:16px;left:16px}
    .act-mark .name{font-size:16px}
    .toolrail{top:8px;right:8px}
    .prompt{left:16px;bottom:20px;width:calc(100vw - 32px);min-height:84px;padding-left:12px;padding-right:8px}
    .prompt::after{left:-16px;right:-8px}
    .hint-title{font-size:16px}
    .ui .hint{font-size:14px;line-height:1.65}
    .keys{display:none}
    #actcard .acn{font-size:40px}
    #actcard .acs{font-size:14px;max-width:320px;padding:0 16px}
    #actcard .aci{font-size:12px;max-width:320px}
  }
  @media (max-height:620px) and (orientation:landscape){
    #prelude{justify-content:flex-start;padding:18px 24px;overflow-y:auto}
    #prelude::before{inset:8px}
    #prelude .eyebrow{margin-bottom:8px}
    #prelude .big{font-size:34px}
    #prelude .story{margin-top:10px;font-size:13px;line-height:1.55}
    #prelude .question{margin-top:10px}
    .mode-options{margin-top:8px}
    .mode-option{min-height:78px;padding:10px 18px}
    #prelude .note{margin-top:8px}
    #prelude .waiting{margin-top:16px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    #enter .big{filter:none;transform:none}
  }
  #webgazerVideoContainer,#webgazerVideoFeed,#webgazerFaceOverlay,#webgazerFaceFeedbackBox,#webgazerGazeDot{display:none!important}
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="ui">
    <div class="act-mark" aria-live="polite">
      <span class="no" id="actNo">壹</span>
      <span class="name" id="actName">一園春</span>
      <span class="phase" id="actPhase">觀測中</span>
    </div>
    <div class="toolrail" aria-label="作品工具">
      <button class="tool" id="redream" type="button" style="display:none" aria-label="再梦一回" title="再梦一回"><span class="glyph" aria-hidden="true">↻</span></button>
      <span id="redreamgap" style="display:none"></span>
      <button class="tool tool-gaze" id="gaze" type="button" aria-label="开启目光观照" title="目光观照"><span class="glyph" aria-hidden="true">目</span><span class="tool-label">目光觀照</span></button>
      <button class="tool" id="reenter" type="button" aria-label="重入园林" title="重入园林"><span class="glyph" aria-hidden="true">↺</span></button>
    </div>
    <div class="prompt" role="status" aria-live="polite" aria-atomic="true">
      <span class="label" id="hintLabel">此刻</span>
      <div class="hint-title" id="hintTitle"></div>
      <div class="hint" id="hint"></div>
      <div class="hint-action" id="hintAction"></div>
    </div>
    <div class="keys" id="keys">空格 · → · R</div>
  </div>
  <div id="curcur"></div>
  <section id="prelude" aria-labelledby="preludeTitle">
    <div class="eyebrow">量 子 游 園 · 預 備 幕</div>
    <div class="big" id="preludeTitle">觀 之 · 即 現</div>
    <p class="story">園林尚未定形。你看向哪裡，哪裡才從疊加中顯現；指尖、目光與氣息，將一路改寫這場夢。</p>
    <div class="question">選擇本次游園方式</div>
    <div class="mode-options" role="group" aria-label="选择游园方式">
      <button class="mode-option" type="button" data-input-mode="pointer">
        <span class="icon" aria-hidden="true">↖</span>
        <span class="name">指 針 觀 遊</span>
        <span class="detail">鼠標或觸控掃過字粒；過門與精細動作仍由手完成</span>
      </button>
      <button class="mode-option" type="button" data-input-mode="gaze">
        <span class="icon" aria-hidden="true">目</span>
        <span class="name">目 光 觀 照</span>
        <span class="detail">看向字粒使它顯現；先完成約二十至三十秒九字校準</span>
      </button>
    </div>
    <div class="note">途中可用右上「目」隨時開關；關閉後立即回到指針</div>
    <div class="waiting" role="status">正在請出觀照之目<br>請允許攝像頭；影像只在本機運算，不會上傳
      <button type="button" id="gazeFallback">改 用 指 針</button>
    </div>
  </section>
  <div id="enter" role="button" tabindex="0" aria-label="轻触入园">
    <div class="eyebrow">量 子 游 園 · 《牡丹亭》 × 量子观测</div>
    <div class="sub">第 壹 幕</div>
    <div class="big">一 園 春</div>
    <div class="story" id="enterStory"></div>
    <div class="legend" id="enterLegend">
      <span class="lh">观 法</span>
      <span class="item"><i>一</i><em>移目或移鼠，让虚墨凝成真字</em></span>
    </div>
    <div class="blink">轻触入园</div>
  </div>
  <div id="actcard" aria-live="polite">
    <div class="ace">量 子 游 園 · 《牡丹亭》 × 量子观测</div>
    <div class="acno"></div>
    <div class="acn"></div>
    <div class="acs"></div>
    <div class="aci"></div>
  </div>
<script>
"use strict";
const SERIF='"Songti SC","STSong","SimSun",serif', TAU=Math.PI*2;
const REDUCED=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const cv=document.getElementById('c')||document.getElementById('scene');
let ctx=cv.getContext('2d');
let W,H,DPR=1, scale, ox, oy, BRUSH=200;

/* 确定性随机(仅用于布局,保证与丙底图一致) */
let _s=20260606>>>0;
const rnd=()=>{ _s=(_s*1664525+1013904223)>>>0; return _s/4294967296; };

/* ====== 丙·尺度版引擎(生成 items 作"坍缩目标层") ====== */
const T1=1.0,T2=0.78,T3=0.56,T4=0.42,T5=0.33,T6=0.26,T7=0.21,T8=0.175;
const COL={ fig:"#ede7d8", near:"#d7d1c3", mid:"#aeb7ad", far:"#83998f",
            faint:"#657c72", ghost:"#50645b", water:"#668d82", gold:"#d2ae68" };
const VW=16, VH=9;
const items=[], boxes=[], PROTECT=[]; let _grp=null;   // _grp:items 分组标签(人物游走/寻人/定墙 等开门条件用)
function hit(x,y,w,h){ for(const b of boxes){ if(Math.abs(x-b.x)<(w+b.w)/2 && Math.abs(y-b.y)<(h+b.h)/2) return true; } return false; }
function put(x,y,text,size,color,o){
  o=o||{}; const vert=!!o.vert, f=o.f==null?0.94:o.f, pad=o.pad==null?0.05:o.pad;
  const w=((vert?1:text.length)*size+pad)*f, h=((vert?text.length:1)*size+pad)*f;
  if(hit(x,y,w,h)) return false;
  boxes.push({x,y,w,h});
  items.push({x,y,text,size,color,vert,grp:_grp,a:o.a==null?(0.85+rnd()*0.15):o.a});
  return true;
}
function protect(x0,y0,x1,y1){ PROTECT.push({x0,y0,x1,y1}); }
function inProtect(x,y){ for(const p of PROTECT){ if(x>=p.x0&&x<=p.x1&&y>=p.y0&&y<=p.y1) return true; } return false; }
const pick=v=>v[(rnd()*v.length)|0];
function anchor(x,y,ch,size,color,a){ if(put(x,y,ch,size,color,{pad:0.14,a:a==null?1:a})) items[items.length-1].anc=true; }
function organic(cx,cy,rx,ry,vocab,size,color,density){ density=density==null?1:density;

      const cands=[];
      if(mouseOver) cands.push([(mouseX-ox)/scale,(mouseY-oy)/scale]);
      if(GAZE.on&&performance.now()-(GAZE.lastSample||0)<650&&!GAZE.calibrating) cands.push([(GAZE.sx-ox)/scale,(GAZE.sy-oy)/scale]);
      for(const [mx,my] of cands){ if(Math.abs(mx-7.4)<2.6) pd=Math.max(pd, Math.max(0,Math.min(1,(6.0-my)/(6.0-4.2)))); }
      XW.p += (pd-XW.p)*Math.min(1,dt*1.1);             // 按规格:以 dt×1.1 追随,保留步速感
      if(XW.p>0.86){ XW.hold+=dt; if(XW.hold>0.7){ gateOpen(); return; } } else XW.hold=Math.max(0,XW.hold-dt*0.8);
    }
  } else if(st.frac>0.26) gateOpen();                 // 兜底
}
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; gateT+=dt;
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  if(paperCv) ctx.drawImage(paperCv,0,0,W,H);
  if(GAZE.calibrating){ drawCalibScene(dt); requestAnimationFrame(frame); return; }   // 校准独立成景,幕暂歇
  if(mode==='blow'){ blowDraw(dt); updateLoreFocus(null,dt); if(MIC.on) MIC.tick(dt);
    if(!collapsed && MIC.on){                                   // 气息条:吹气被听到多少,一目了然
      MIC.disp+=(MIC.raw-MIC.disp)*Math.min(1,dt*12);
      const lv=Math.min(1,MIC.disp/(MIC.triggerLevel||MIC.PUFF)), bw=W*0.16, bx=W/2-bw/2, by=Math.min(H-104,H*0.78);  // 满格跟随当前底噪校正后的强吹阈值
      ctx.fillStyle='rgba(126,159,144,0.22)'; ctx.fillRect(bx,by,bw,2);
      ctx.fillStyle=`rgba(207,230,216,${0.35+lv*0.55})`; ctx.fillRect(bx,by,bw*lv,2);
      ctx.fillStyle='rgba(224,193,120,0.5)'; ctx.fillRect(bx+bw-1,by-2,2,6);  // 满格即惊梦的刻度
      ctx.font=`12px ${SERIF}`; ctx.textAlign='center'; ctx.fillStyle='rgba(126,159,144,0.55)';
      ctx.fillText('氣', W/2, by-12);
    } }
  else { const st=drawItems(dt); wanderTick(dt); drawSouls(); drawFloats(dt);
    for(const k in WANDER){
      const wakeAt=(cur===0&&k==='春香')?0.78:0.92;    // 入园不写操作说明后，春香清晰可辨即应声；其余人物仍守原阈值
      if(!WANDER[k].on && (st.g[k]||0)>wakeAt) wanderWake(k);
    }
    if(!trans) checkGoal(st,dt); }   // 常跑：糾纏橋顯出單人門後仍可繼續看見另一人，改寫當前命途
  if(gateReady && !trans && (mode!=='blow' || collapsed)){            // 出口缓缓显形(惊梦台:渡口字在 blowDraw 内画,此处只升 gateA)
    gateA=Math.min(1,gateA+dt/2.6);
    if(mode!=='blow'){ ctx.save(); ctx.globalAlpha=gateA; drawPassage(); ctx.restore(); } }
  if(flashA>0.001){ ctx.fillStyle=`rgba(224,193,120,${flashA*0.5})`; ctx.fillRect(0,0,W,H); flashA*=Math.pow(0.02,dt); if(flashA<0.02) flashA=0; } // 惊梦金闪
  if(mode!=='blow' && mouseOver && !trans){
    const g=ctx.createRadialGradient(mouseX,mouseY,0,mouseX,mouseY,BRUSH*0.62);
    g.addColorStop(0,'rgba(237,231,216,0.11)'); g.addColorStop(0.6,'rgba(131,153,143,0.035)'); g.addColorStop(1,'rgba(131,153,143,0)');
    ctx.fillStyle=g; ctx.fillRect(mouseX-BRUSH,mouseY-BRUSH,BRUSH*2,BRUSH*2);
    ctx.strokeStyle='rgba(198,104,88,0.82)'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(mouseX,mouseY,10,-Math.PI*0.62,Math.PI*0.18); ctx.stroke();
    ctx.beginPath(); ctx.arc(mouseX,mouseY,10,Math.PI*0.38,Math.PI*1.18); ctx.stroke();
    ctx.fillStyle='rgba(198,104,88,0.78)'; ctx.beginPath(); ctx.arc(mouseX,mouseY,1.5,0,TAU); ctx.fill();
  }
  if(mode==='blow' && mouseOver && !trans){   // 惊梦幕:画布藏了系统光标,须自绘小光环;近触点时变亮变大
    const near = collapsed && gateReady && Math.hypot(mouseX-passX,mouseY-passY)<passR;
    ctx.strokeStyle=`rgba(198,104,88,${near?0.92:0.48})`; ctx.lineWidth=near?1.4:1;
    ctx.beginPath(); ctx.arc(mouseX,mouseY,near?13:9,0,TAU); ctx.stroke();
    if(near){ ctx.fillStyle='rgba(198,104,88,0.72)'; ctx.beginPath(); ctx.arc(mouseX,mouseY,2,0,TAU); ctx.fill(); }
  }
  if(GAZE.on && performance.now()-(GAZE.lastSample||0)<650 && !GAZE.calibrating && cur!==1){  // 只绘新鲜预测；人脸离开时旧丹凤眼不滞留
    drawGazeEye(GAZE.sx,GAZE.sy);
    if(!trans) dwellTick(dt);
  }
  if(trans){   // 过场:淡入黑→换景→淡出黑(此景散去·彼景叠起)
    trans.t += dt/1.6;
    const a=trans.t<0.5?trans.t*2:1-(trans.t-0.5)*2;
    ctx.fillStyle=`rgba(6,9,8,${Math.max(0,Math.min(1,a))})`; ctx.fillRect(0,0,W,H);
    if(!trans.swapped && trans.t>=0.5){ loadStation(trans.to); trans.swapped=true; }
    if(trans.t>=1) trans=null;
  }
  requestAnimationFrame(frame);
}

/* ====== 声 · 极简夜景 pad ====== */
const Sound={ ac:null, master:null, padGain:null, started:false,
  start(){ if(this.started) return; this.started=true;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ac=this.ac=new AC(); const m=this.master=ac.createGain(); m.gain.value=0; m.connect(ac.destination);
    const pg=this.padGain=ac.createGain(); pg.gain.value=0;
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=460; lp.Q.value=3;
    const o1=ac.createOscillator(),o2=ac.createOscillator(); o1.type='triangle'; o2.type='sine'; o1.frequency.value=98; o2.frequency.value=98*1.004;
    const lfo=ac.createOscillator(),lg=ac.createGain(); lfo.frequency.value=0.06; lg.gain.value=150; lfo.connect(lg); lg.connect(lp.frequency);
    o1.connect(pg); o2.connect(pg); pg.connect(lp); lp.connect(m); o1.start(); o2.start(); lfo.start();
    m.gain.linearRampToValueAtTime(0.6, ac.currentTime+2.0); this.setScene(cur);
  },
  amb:{nodes:[],timers:[],gains:[]},
  fadeStop(set,dur){ if(!set) return; for(const tm of set.timers) clearInterval(tm); set.timers.length=0;   // 旧声景丝滑渐隐:增益渐降→延后停节点(不硬切)
    const ac=this.ac, t=ac.currentTime;
    for(const g of (set.gains||[])){ try{ g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value,t); g.gain.linearRampToValueAtTime(0,t+dur); }catch(e){} }
    const ns=set.nodes; setTimeout(()=>{ for(const n of ns){ try{n.stop&&n.stop();}catch(e){} try{n.disconnect&&n.disconnect();}catch(e){} } }, dur*1000+150); },
  noiseSrc(loop){ const ac=this.ac, buf=ac.createBuffer(1,(ac.sampleRate*1.5)|0,ac.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const src=ac.createBufferSource(); src.buffer=buf; src.loop=loop!==false; return src; },
  lap(){ const ac=this.ac; if(!ac) return; const t=ac.currentTime, src=this.noiseSrc(false);   // 一记拍岸碎浪
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=550+Math.random()*900; bp.Q.value=1.1;
    const g=ac.createGain(), a=0.16+Math.random()*0.22, d2=0.5+Math.random()*0.6, v=0.016+Math.random()*0.02;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+a); g.gain.exponentialRampToValueAtTime(0.0006,t+a+d2);
    let tail=g; if(ac.createStereoPanner){ const pan=ac.createStereoPanner(); pan.pan.value=(Math.random()*2-1)*0.55; g.connect(pan); tail=pan; }
    src.connect(bp); bp.connect(g); tail.connect(this.master); src.start(t); src.stop(t+a+d2+0.1); },
  drip(){ const ac=this.ac; if(!ac) return; const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain();  // 一滴落水
    o.type='sine'; o.frequency.setValueAtTime(680+Math.random()*520,t); o.frequency.exponentialRampToValueAtTime(230,t+0.09);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.032,t+0.012); g.gain.exponentialRampToValueAtTime(0.0006,t+0.3);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.32); },
  setScene(i){ if(!this.ac) return; const ac=this.ac, t=ac.currentTime;
    const old=this.amb; this.amb={nodes:[],timers:[],gains:[]};
    this.fadeStop(old, 1.4);                                                  // 旧声景交叉淡变渐隐(不戛然而止)
    this.padGain.gain.cancelScheduledValues(t); this.padGain.gain.setValueAtTime(this.padGain.gain.value,t);
    this.padGain.gain.linearRampToValueAtTime(PAD_LVL[i]||0, t+1.6);          // 嗡嗡 pad 仅惊梦台,丝滑升降
    if(i===3){                                                                 // 纠缠桥(第四幕):夜湖拍岸(碎浪无定时,似水非风) + 水珠 + 偶发低磬
      this.amb.timers.push(setInterval(()=>{ if(Math.random()<0.8) this.lap(); }, 1700));
      this.amb.timers.push(setInterval(()=>{ if(Math.random()<0.5) this.drip(); }, 5600));
      this.amb.timers.push(setInterval(()=>{ if(Math.random()<0.4)
        this.bell(GONG*[LV.zhi,LV.yu][(Math.random()*2)|0]/2, 0.028); }, 9400));
      this.lap();
    } else if(i===2){                                                          // 寻梦廊(第三幕):远风慢涌 + 偶发风铃两三声
      const src=this.noiseSrc(true), lp2=ac.createBiquadFilter(), g=ac.createGain();
      lp2.type='lowpass'; lp2.frequency.value=240; lp2.Q.value=0.7;
      const lfo=ac.createOscillator(), lg=ac.createGain(); lfo.frequency.value=0.05; lg.gain.value=0.022;
      g.gain.value=0; g.gain.linearRampToValueAtTime(0.04, t+2.5);
      lfo.connect(lg); lg.connect(g.gain);
      src.connect(lp2); lp2.connect(g); g.connect(this.master); src.start(); lfo.start();
      this.amb.nodes.push(src,lfo,g,lp2,lg); this.amb.gains.push(g);          // g 入 gains:离场时丝滑渐隐
      this.amb.timers.push(setInterval(()=>{ if(Math.random()<0.6){ const base=[LV.yu,LV.qgong,LV.qshang], n=2+(Math.random()*2|0);
        for(let k=0;k<n;k++) setTimeout(()=>this.bell(GONG*base[(Math.random()*3)|0]*2, 0.022), k*130+Math.random()*80); } }, 9000));
    }
  },
  bell(freq,vol){ const ac=this.ac; if(!ac) return; const t=ac.currentTime;
    const o=ac.createOscillator(),g=ac.createGain(),o2=ac.createOscillator(),g2=ac.createGain();
    o.type='sine';o.frequency.value=freq;o2.type='sine';o2.frequency.value=freq*2.01;g2.gain.value=0.3;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+2.6);
    o.connect(g);o2.connect(g2);g2.connect(g);g.connect(this.master); o.start(t);o2.start(t);o.stop(t+2.7);o2.stop(t+2.7); },
  collapse(){ const ac=this.ac; if(!ac) return; const t=ac.currentTime;
    this.padGain.gain.cancelScheduledValues(t); this.padGain.gain.setValueAtTime(this.padGain.gain.value,t); this.padGain.gain.exponentialRampToValueAtTime(0.02,t+0.5); // 声场塌陷
    this.bell(GONG/2,0.26);                                   // 一记重磬(低宫)
    const buf=ac.createBuffer(1,(ac.sampleRate*1.1)|0,ac.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.6);
    const src=ac.createBufferSource(); src.buffer=buf; const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.2;
    bp.frequency.setValueAtTime(2200,t); bp.frequency.exponentialRampToValueAtTime(180,t+0.9);
    const ng=ac.createGain(); ng.gain.setValueAtTime(0.22,t); ng.gain.exponentialRampToValueAtTime(0.001,t+1.0); // 风噪下扫
    src.connect(bp); bp.connect(ng); ng.connect(this.master); src.start(t); src.stop(t+1.1); } };

/* ====== 尺寸 / 入园 / 过门 ====== */
function resizeLayout(){
  W=window.innerWidth; H=window.innerHeight;
  DPR=Math.max(0.5,Math.min(window.devicePixelRatio||1,2,Math.sqrt(8000000/Math.max(1,W*H))));  // 限总像素，外接高分屏不让双 Canvas 吞掉百兆显存
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  scale=Math.min(W/VW,H/VH)*0.95; ox=(W-VW*scale)/2; oy=(H-VH*scale)/2;
  BRUSH=Math.min(W,H)*0.2; buildPaper();
  if(collapsed && VG){                                  // 窗口变了:诗句与款识重排,免得「再夢」漂出画外
    const {fs,slots}=slotPositions(VG.line);
    VG.fs=fs; VG.sx=slots[0].x; VG.ex=slots[slots.length-1].x; VG.y=H*0.5;
    VG.chosen.forEach((it,i)=>{ const s=slots[i]; if(!s) return; it.tx=s.x; it.ty=s.y; it.lockFs=fs; });
  }
}
window.addEventListener('resize', resizeLayout);
cv.addEventListener('pointermove', e=>{ mouseX=e.clientX; mouseY=e.clientY; mouseOver=true; });
cv.addEventListener('pointerleave', ()=>{ mouseOver=false; });
cv.addEventListener('pointerup', e=>{ if(e.pointerType==='touch'){ mouseOver=false; mouseX=mouseY=-1e4; } });
cv.addEventListener('pointercancel', e=>{ if(e.pointerType==='touch'){ mouseOver=false; mouseX=mouseY=-1e4; } });
cv.addEventListener('pointerdown', e=>{ if(GAZE.calibrating){ calibClick(); return; }   // 看字敲击:随处点皆确认
  if(trans) return;
  if(mode==='blow' && !collapsed){ triggerCollapse(); return; }                  // 惊梦台:点按=惊梦
  if(cur===3){                                                                   // 糾纏橋：點當前觀測路徑生成的命途門
    if(gateReady) for(const g of BR.list){ if(Math.hypot(e.clientX-g.x,e.clientY-g.y)<g.r){
      goFate(g.kind==='B'?'yuan':(g.kind==='L'?'shang':'hua')); return; } }
    return; }
  if(gateReady && (mode!=='blow'||collapsed) && Math.hypot(e.clientX-passX,e.clientY-passY)<passR){
    if(cur===2) goPage('新幕/肆·寫真.html'); else advance(); } });  // 寻梦廊→寫真(八幕链);其余照常前行
function enter(){ const e=document.getElementById('enter'); if(e.classList.contains('gone')) return; e.classList.add('gone'); e.tabIndex=-1; e.setAttribute('aria-hidden','true'); e.blur();

window.addEventListener('keydown', ev=>{
  if(ev.repeat) return;
  if(INTRO.active||INTRO.reporting) return;             // 预备幕与方式确认报幕均不得被 Enter/Space 绕过
  const entered=document.getElementById('enter').classList.contains('gone');

  if(GAZE.calibrating && ev.code==='Space'){ ev.preventDefault(); calibClick(); return; }   // 校准期空格=敲一下(眼不必离字)
  if(ev.code==='Space'){ ev.preventDefault(); if(!entered) enter(); else if(mode==='blow'){ collapsed?reDream():triggerCollapse(); } }
  if(ev.key==='ArrowRight' && gateReady && (mode!=='blow'||collapsed)){
    if(cur===2) goPage('新幕/肆·寫真.html'); else if(cur===3){ if(BR.T) goFate('yuan'); } else advance(); }  // 桥上→键=默认圆途(丝成才有)
  if(ev.key==='r'||ev.key==='R'){ loadStation(cur); }   // 重看本景
});

/* ====== 目光觀照(WebGazer·全程本机,不外传) ====== */
const INTRO={active:false, choosing:false, awaitingGaze:false, cancelledGaze:false, reported:false, reporting:false};
function rememberInputMode(mode){ try{ sessionStorage.setItem('qg_input_mode',mode); }catch(_){} }
function hidePrelude(){
  const p=document.getElementById('prelude'); if(!p) return;
  p.classList.add('gone'); p.setAttribute('aria-hidden','true');
  document.documentElement.classList.remove('qg-prelude');
  INTRO.active=false;
}
function reportFirstAct(){
  if(INTRO.reported) return;
  INTRO.reported=true;
  if(document.body.classList.contains('in')){ showActCard(0); return; }   // 目光校准已进入画布，用幕间层报第一幕
  const e=document.getElementById('enter');
  e.classList.remove('calibration-suspended');
  e.inert=false;
  INTRO.reporting=true;
  e.classList.add('journey','mode-report');
  e.removeAttribute('aria-hidden');
  e.setAttribute('role','status');
  e.removeAttribute('tabindex');
  e.setAttribute('aria-label','第 壹 幕 一園春，即將自動進入');
  Sound.start();                                                        // 仍在方式选择的用户手势内解锁声场
  setTimeout(()=>{ INTRO.reporting=false; e.classList.remove('mode-report'); enter(); },REDUCED?240:2200);
}
function finishGazePrelude(ok){
  if(!INTRO.awaitingGaze) return;
  INTRO.awaitingGaze=false;
  if(!ok){
    rememberInputMode('pointer');
    setHint('〔'+MU[0]+'〕'+STATIONS[0].name+' · '+OPEN_HINT[0]);
  }
  const p=document.getElementById('prelude'); if(p) p.classList.remove('is-waiting');
  hidePrelude();
  reportFirstAct();
}
function cancelGazePrelude(){
  if(!INTRO.awaitingGaze) return;
  INTRO.awaitingGaze=false;
  INTRO.cancelledGaze=true;
  rememberInputMode('pointer');
  setGazeControl(false);
  hidePrelude();
  reportFirstAct();
}
function chooseInputMode(mode){
  if(INTRO.choosing) return;
  INTRO.choosing=true;
  rememberInputMode(mode);
  requestAnyFullscreen();                         // 方式选择本身就是首个真实手势
  if(mode==='gaze'){
    INTRO.awaitingGaze=true;
    const p=document.getElementById('prelude'); if(p) p.classList.add('is-waiting');
    const e=document.getElementById('enter'); if(e) e.classList.add('calibration-suspended');
    Sound.start();                                // 在选择手势内解锁声场，但不提前启动第一幕
    gazeToggle();                                 // 预备幕保持遮挡；校准景先画稳，再撤预备幕
  }else{
    hidePrelude();
    reportFirstAct();
  }
}
function initPrelude(){
  const p=document.getElementById('prelude'); if(!p||!document.documentElement.classList.contains('qg-prelude')) return;
  INTRO.active=true;
  const enterEl=document.getElementById('enter'); enterEl.setAttribute('aria-hidden','true'); enterEl.tabIndex=-1; enterEl.inert=true;
  p.querySelectorAll('[data-input-mode]').forEach(b=>b.addEventListener('click',()=>chooseInputMode(b.dataset.inputMode)));
  document.getElementById('gazeFallback').addEventListener('click',cancelGazePrelude);
}
const GAZE={on:false, loading:false, ready:false, needsCalib:false, resumeSaved:false, reopenSaved:false, restartAfterCancel:false, sx:0, sy:0, spd:0, dwell:0, fx:null, fy:null,lastSample:0};
const CALIB_PTS=[[0.08,0.08],[0.5,0.08],[0.92,0.08],[0.08,0.5],[0.92,0.5],[0.08,0.92],[0.5,0.84],[0.92,0.92],[0.5,0.5]];  // 外八方先行,中宫「瞳」收官;下中点抬至0.84让开提示条(字不与引导语相叠)
function fsDocSafe(){ try{ return (window.self!==window.top&&window.top.document)?window.top.document:document; }catch(e){ return document; } }
function fsElSafe(){ try{ return (window.self!==window.top&&window.top.document)?window.top.document.documentElement:document.documentElement; }catch(e){ return document.documentElement; } }
function isAnyFullscreen(){ try{ return !!fsDocSafe().fullscreenElement; }catch(e){ return false; } }
function canRequestFullscreen(){
  try{
    if(typeof navigator!=='undefined' && navigator.webdriver) return false;
    let ua=null; try{ ua=(window.top&&window.top.navigator&&window.top.navigator.userActivation)||navigator.userActivation; }catch(e){ ua=(typeof navigator!=='undefined')?navigator.userActivation:null; }
    if(ua && ua.isActive===false) return false;
    const doc=fsDocSafe(), el=fsElSafe();
    if(!doc || doc.fullscreenEnabled!==true || !el || !el.requestFullscreen) return false;
    const pol=doc.permissionsPolicy||doc.featurePolicy;
    if(pol&&pol.allowsFeature){ try{ if(pol.allowsFeature('fullscreen')===false) return false; }catch(e){} }
    return true;
  }catch(e){ return false; }
}
function requestAnyFullscreen(){ try{ if(!isAnyFullscreen()&&canRequestFullscreen()){ const p=fsElSafe().requestFullscreen(); if(p&&p.catch) p.catch(()=>{}); } }catch(e){} }
function setGazeControl(active){
  const b=document.getElementById('gaze'); if(!b) return;
  const calibrating=active&&!!GAZE.calibrating;
  b.dataset.active=active?'true':'false';
  b.setAttribute('aria-label',calibrating?'退出校准，改用指针':(active?'停止目光观照':'开启目光观照'));
  b.title=calibrating?'退出校准，改用指针':(active?'停止目光观照':'目光观照');
  const label=b.querySelector('.tool-label'); if(label) label.textContent=calibrating?'退出校準':'目光觀照';
}
function endGazeSession(){
  try{ const v=document.getElementById('webgazerVideoFeed');
    if(v&&v.srcObject) v.srcObject.getTracks().forEach(track=>track.stop()); }catch(e){}
  try{ webgazer.removeMouseEventListeners(); }catch(e){}
  try{ webgazer.end(); }catch(e){}
}
function finishCancelledGazeStart(){
  GAZE.loading=false; GAZE.on=false; GAZE.ready=false; GAZE.resumeSaved=false;
  endGazeSession(); setGazeControl(false);
  if(GAZE.restartAfterCancel){
    GAZE.restartAfterCancel=false;

}
function gazeToggle(resumeSaved){

  if(GAZE.on){ const wasCalibrating=GAZE.calibrating;
    GAZE.on=false; GAZE.ready=false; GAZE.resumeSaved=false;
    GAZE.reopenSaved=!!GAZE.warp&&!GAZE.needsCalib&&!wasCalibrating;
    if(wasCalibrating){ GAZE.calibrating=false; GAZE.needsCalib=true; document.body.classList.remove('gaze-calibrating'); }
    endGazeSession();
    rememberInputMode('pointer'); setGazeControl(false);
    if(wasCalibrating&&INTRO.awaitingGaze) finishGazePrelude(false);
    else setHint(wasCalibrating?'校準已止 —— 已關閉攝像頭，改用指針游園':'觀照已歇 —— 攝像頭已關閉，仍以鼠標游園');

    rememberInputMode('gaze'); setGazeControl(true); if(GAZE.needsCalib){ GAZE.needsCalib=false; gazeCalib(); }

    if(INTRO.cancelledGaze){

    }
    return;
  }
  INTRO.cancelledGaze=false;                       // 观众在改用指针后仍可于任一幕主动重新开目

    setHint('此打開方式拿不到攝像頭 —— 請雙擊文件夾裡的「啟動.command」，從 localhost 打開本頁再試');
    finishGazePrelude(false); return; }

  s.onerror=()=>{ GAZE.loading=false; if(INTRO.cancelledGaze){ finishCancelledGazeStart(); return; }
    setHint('未找到 webgazer.js —— 請確認它與本頁同在一個文件夾'); finishGazePrelude(false); };

async function gazeStart(){
  const safe=f=>{ try{ f(); }catch(e){} };                // 装饰性调用各自兜异常(begin 前摸 video 元素会 TypeError)
  if(INTRO.cancelledGaze){ finishCancelledGazeStart(); return; }
  try{
    if(webgazer.params){ webgazer.params.showVideoPreview=false; webgazer.params.showVideo=false;
      webgazer.params.showFaceOverlay=false; webgazer.params.showFaceFeedbackBox=false; webgazer.params.showGazeDot=false;
      webgazer.params.saveDataAcrossSessions=true; }                                  // 回归模型跨刷新留存
    safe(()=>webgazer.applyKalmanFilter(true));

      const bad=/iphone|ipad|continuity|連續互通|连续互通|desk view/i, good=/facetime|built-?in|内建|內建|integrated/i;
      const saved=localStorage.getItem('qg_cam');                                     // 布展配置页(?setup=1)选定的优先
      let pick=(saved&&vids.find(d=>d.deviceId===saved)) || vids.find(d=>good.test(d.label)) || vids.find(d=>d.label&&!bad.test(d.label));
      if(pick&&pick.deviceId) webgazer.params.camConstraints={video:{deviceId:{exact:pick.deviceId},width:{ideal:640},height:{ideal:480}}};
    }catch(e){}
    webgazer.setGazeListener(d=>{ if(!d||!GAZE.on) return;
      GAZE.lastSample=performance.now();
      let gx=d.x, gy=d.y; GAZE.rx=gx; GAZE.ry=gy;               // 原始预测留档(校准采样必须用未修正值)
      if(GAZE.warp&&GAZE.warp.length){                          // 九锚点归一化反距离加权:resize/全屏后仍落在同一相对屏区
        const nx=gx/Math.max(1,W), ny=gy/Math.max(1,H);
        let wx=0,wy=0,ws=0;
        for(const q of GAZE.warp){ const w=1/Math.max(1e-5,(nx-q.px)*(nx-q.px)+(ny-q.py)*(ny-q.py)); wx+=w*q.dx; wy+=w*q.dy; ws+=w; }
        gx+=Math.max(-0.6,Math.min(0.6,wx/ws))*W; gy+=Math.max(-0.6,Math.min(0.6,wy/ws))*H;
      }
      const ddx=gx-GAZE.sx, ddy=gy-GAZE.sy, step=Math.hypot(ddx,ddy);   // 自适应平滑:静稳动跟,扫视不滞后
      const a=Math.max(0.05,Math.min(0.42,step/110));                   // 规格:clamp(step/110,.05,.42)
      GAZE.sx+=ddx*a; GAZE.sy+=ddy*a;
      GAZE.spd=(GAZE.spd||0)*0.7+step*0.3;                       // 眼动速度估计:据此判"在凝视"还是"在扫视"(扫视不点亮,见 drawItems)
    });
    await webgazer.begin();
    if(INTRO.cancelledGaze){
      finishCancelledGazeStart(); return;
    }
    safe(()=>webgazer.showVideoPreview(false)); safe(()=>webgazer.showVideo(false));
    safe(()=>webgazer.showFaceOverlay(false));  safe(()=>webgazer.showFaceFeedbackBox(false));
    safe(()=>webgazer.showPredictionPoints(false));
    GAZE.loading=false; GAZE.on=true; GAZE.ready=true;    // 先跟随后精校:目光点立现,校准是"把它调准"而非先干27击
    try{ const w=JSON.parse(localStorage.getItem('qg_gaze_warp')||'null');           // 上次校准的九锚修正:刷新不丢
      if(Array.isArray(w)&&w.length>=7&&w.every(q=>q&&q.unit==='norm')) GAZE.warp=w; }catch(e){}

    GAZE.loading=false; GAZE.on=false; GAZE.resumeSaved=false; setGazeControl(false); setHint('觀照未成 —— '+why+'；仍以鼠標游園');

const CALIB_PER=3;
const CALIB_CH=[...'柳月亭松桐山池燭瞳'];               // 九字小景:外八方+中宫;最后一枚=瞳(點睛)
const CALIB_NOTE=[LV.qgong,LV.qshang,LV.yu,LV.jue,LV.zhi,LV.shang,LV.gong,LV.zhi/2,LV.zhi*2].map(r=>GONG*r);

function gazeCalib(){ GAZE.calibrating=true;            // 校准独立成景,不叠在任何一幕上
  document.body.classList.add('gaze-calibrating');
  setGazeControl(true);
  CSCENE.i=0; CSCENE.hits=0; CSCENE.ACC={}; CSCENE.done=[]; CSCENE.flash=0; CSCENE.glyph=CALIB_CH[0]; CSCENE.gt=0;
  try{ webgazer.removeMouseEventListeners(); }catch(e){}         // 校准期掐掉库的"点哪看哪"默认训练——眼在字上手在别处,真实落点必须由我们喂
  setHint('觀照校準 · 九字小景 —— 只管看那枚字；左鍵或空格隨處敲三下。右上「退出校準」可停攝像頭並改用指針'); }
function calibClick(){                                  // 看字敲击:眼睛锁定那枚字,手随处确认——样本永远喂字的位置,与鼠标无关
  if(GAZE.fsResume && !isAnyFullscreen()){               // 授权框踢出了全屏:借这次敲击(用户手势)把外壳全屏接回来
    requestAnyFullscreen(); GAZE.fsResume=false;
    setHint('全屏已接回 —— 請看定此字，再敲一下'); return; }  // 不把全屏切换前的坐标混入九锚
  const p=CALIB_PTS[CSCENE.i]; if(!p) return;
  const x=p[0]*W, y=p[1]*H;

  try{                                                           // WebGazer 只在内建 click listener 中落盘回归模型；用同一锚点触发一次无界面副作用的合成点击，再立刻冻结监听

  if(GAZE.rx||GAZE.ry){ const a=CSCENE.ACC[CSCENE.i]=CSCENE.ACC[CSCENE.i]||{sx:0,sy:0,n:0}; a.sx+=GAZE.rx; a.sy+=GAZE.ry; a.n++; }

function finishCalib(){

      dx:pt[0]-px/Math.max(1,window.innerWidth),dy:pt[1]-py/Math.max(1,window.innerHeight)}); } });
  if(warp.length<7){                                      // 没看见足够原始预测时不谎报成功，保留粗跟随并明确降级
    GAZE.calibrating=false; GAZE.on=true; GAZE.ready=true; GAZE.needsCalib=true; GAZE.warp=null; document.body.classList.remove('gaze-calibrating');
    try{ localStorage.removeItem('qg_gaze_warp'); webgazer.removeMouseEventListeners(); }catch(e){}
    setGazeControl(true); setHint('精校未成 —— 仍可粗略觀照；調整光線與坐姿後，先停「目」再開即可重校');
    finishGazePrelude(true); return;

function drawCalibScene(dt){

  const fs=Math.min(W,H)*0.058;
  ctx.font=(fs|0)+'px '+SERIF;
  for(const d of CSCENE.done){ ctx.fillStyle='rgba(224,193,120,0.8)'; ctx.fillText(d.ch, d.x*W, d.y*H); }   // 已看真:金,落定
  const p=CALIB_PTS[CSCENE.i]; if(!p) return;
  const x=p[0]*W, y=p[1]*H, cond=CSCENE.hits/CALIB_PER;
  CSCENE.gt+=dt; if(CSCENE.gt>0.09*(1+cond*3)){ CSCENE.gt=0;                          // 叠加态闪变,逐击趋定
    CSCENE.glyph=(Math.random()<0.55*(1-cond))?randGlyphs(1):CALIB_CH[CSCENE.i]; }
  const pu=0.5+0.5*Math.sin(gateT*2.4);
  const g=ctx.createRadialGradient(x,y,0,x,y,fs*1.6);                                 // 微晕引目
  g.addColorStop(0,'rgba(224,193,120,'+(0.10+0.08*pu).toFixed(3)+')'); g.addColorStop(1,'rgba(224,193,120,0)');
  ctx.fillStyle=g; ctx.fillRect(x-fs*1.6,y-fs*1.6,fs*3.2,fs*3.2);
  const j=(1-cond)*6;
  ctx.fillStyle='rgba('+((207+17*cond)|0)+','+((230-37*cond)|0)+','+((216-96*cond)|0)+','+(0.6+0.4*cond).toFixed(2)+')';   // 冷玉→金
  ctx.font=((fs*(0.9+0.1*cond))|0)+'px '+SERIF;
  ctx.fillText(CSCENE.glyph, x+(Math.random()-0.5)*j, y+(Math.random()-0.5)*j);
  if(CSCENE.flash>0){ ctx.fillStyle='rgba(224,193,120,'+(CSCENE.flash*0.3).toFixed(3)+')';
    ctx.fillRect(0,0,W,H); CSCENE.flash=Math.max(0,CSCENE.flash-dt*2.4); }
  // 校准场不再画手的形体(2026-06-12 看字敲击版):随处敲即确认,手无须被看见——画了反而引目光离字
}

/* 目光视点 = 一只古画丹凤眼(非现代/日式眼 icon):内眦低、外眦上挑,细笔双睑(上重下轻),小瞳偏内;
   金线如朱砂勾描,与全作"字粒金"同语。随凝视度 gGain 微微睁阖——看得越定,眼越亮。 */
function drawGazeEye(cx,cy){
  const ew=Math.max(15, Math.min(W,H)*0.018), eh=ew*0.42;
  const open=0.6+0.4*Math.max(0,Math.min(1,(GAZE.gain||0)));   // 凝视度→睁阖(由 drawItems 暴露)
  ctx.save(); ctx.translate(cx,cy);
  const glow=ctx.createRadialGradient(0,0,0,0,0,ew*1.7);             // 极淡金晕,替代旧光圈
  glow.addColorStop(0,'rgba(224,193,120,0.12)'); glow.addColorStop(1,'rgba(224,193,120,0)');
  ctx.fillStyle=glow; ctx.fillRect(-ew*1.7,-ew*1.7,ew*3.4,ew*3.4);
  ctx.lineJoin='round'; ctx.lineCap='round'; ctx.strokeStyle='rgba(224,193,120,0.9)';
  const ix=-ew, iy=eh*0.30, oxc=ew*1.18, oy=-eh*0.62;               // 内眦低 / 外眦上挑(丹凤眼之势)
  ctx.lineWidth=1.7;                                                 // 上睑重
  ctx.beginPath(); ctx.moveTo(ix,iy); ctx.quadraticCurveTo(-ew*0.05,-eh*(0.7+0.7*open), oxc,oy); ctx.stroke();
  ctx.lineWidth=1.0;                                                 // 下睑轻
  ctx.beginPath(); ctx.moveTo(ix,iy); ctx.quadraticCurveTo(-ew*0.05, eh*(0.5+0.5*open), oxc,oy); ctx.stroke();
  ctx.fillStyle='rgba(224,193,120,'+(0.7+0.25*open).toFixed(2)+')';  // 瞳:小,偏内
  ctx.beginPath(); ctx.arc(-ew*0.12,-eh*0.04, eh*0.5*open+eh*0.18, 0, TAU); ctx.fill();
  ctx.restore();
}
/* 目光过门=月轮渐盈(2026-06-12 复设,仅司"门"):目光大致落在门左近,小月自朔渐盈,盈满即过。
   宽厚为度:判定半径×1.7;目光浮动不清零,缓退(dt×0.5);其余一切点击仍归手。 */
const DWELL={t:0};
function dwellTick(dt){
  if(DWELL.t<0){ DWELL.t=Math.min(0,DWELL.t+dt); return; }       // 过门后小憩,防连触
  const fresh=performance.now()-(GAZE.lastSample||0)<650;
  if(!fresh || (GAZE.gain||0)<0.35){ DWELL.t=Math.max(0,DWELL.t-dt*1.4); return; } // 人脸离开/预测停更时旧坐标不得继续盈月过门
  let tx=null,ty=null;
  if(gateReady && (mode!=='blow'||collapsed)){
    if(cur===3){ for(const g of BR.list){ if(Math.hypot(GAZE.sx-g.x,GAZE.sy-g.y)<g.r*1.7){ tx=g.x; ty=g.y; break; } } }
    else if(passR>0 && Math.hypot(GAZE.sx-passX,GAZE.sy-passY)<passR*1.7){ tx=passX; ty=passY; }
  }
  if(tx==null){ DWELL.t=Math.max(0,DWELL.t-dt*0.5); return; }    // 缓退不清零:目光一晃,月不立亏
  DWELL.t+=dt; const frac=Math.min(1,DWELL.t/1.4);
  const r=10;
  ctx.strokeStyle='rgba(224,193,120,0.65)'; ctx.lineWidth=1;     // 月轮:朔
  ctx.beginPath(); ctx.arc(GAZE.sx,GAZE.sy,r,0,TAU); ctx.stroke();
  ctx.fillStyle='rgba(224,193,120,'+(0.3+0.45*frac).toFixed(3)+')';
  ctx.beginPath(); ctx.arc(GAZE.sx,GAZE.sy,r*frac,0,TAU); ctx.fill();   // 渐盈至望
  if(frac>=1){ DWELL.t=-1.6;
    cv.dispatchEvent(new PointerEvent('pointerdown',{clientX:tx,clientY:ty,bubbles:true})); }   // 望满,即过(点在门心,不在目点)
}

/* ====== 布展配置页 ?setup=1 ——【设计原则】观众永远不该看到设备问卷;此页仅布展者用 ====== */
if(new URLSearchParams(location.search).get('setup')==='1'){ (async()=>{
  const d=document.createElement('section'); d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true'); d.setAttribute('aria-labelledby','suTitle');
  d.style.cssText='position:fixed;inset:0;z-index:200;background:rgba(8,11,9,0.96);font-family:'+SERIF+';color:#cfe6d8;display:flex;align-items:center;justify-content:center;cursor:auto';
  d.innerHTML='<div style="width:560px;max-width:92vw;border:1px solid rgba(126,159,144,.4);padding:28px 30px">'
    +'<div id="suTitle" style="text-align:center;font-size:18px;letter-spacing:0;color:#e0c178">樂 器 檢 查 · 佈 展 配 置</div>'
    +'<div style="font-size:11px;color:#9fb4aa;text-align:center;margin:8px 0 18px;letter-spacing:0">只供布展者使用；设备测试由你逐项开启，不会在载入时自动索权。</div>'
    +'<label for="suCam" style="display:block;font-size:13px;margin:10px 0 4px">攝像頭（目光觀照 · 须拍到观众的脸）</label>'
    +'<select id="suCam" style="width:100%;background:#101714;color:#cfe6d8;border:1px solid rgba(126,159,144,.4);padding:6px"></select>'
    +'<video id="suVid" muted playsinline style="width:100%;height:150px;object-fit:cover;margin-top:8px;background:#000;border:1px solid rgba(126,159,144,.25)"></video>'
    +'<button id="suPreview" type="button" style="margin-top:8px;min-height:44px;padding:0 12px;background:#101714;color:#cfe6d8;border:1px solid rgba(126,159,144,.45);cursor:pointer">開啟攝像頭預覽</button>'
    +'<label for="suMic" style="display:block;font-size:13px;margin:16px 0 4px">麥克風（以氣驚夢 · 可选 iPhone 作手持氣息法器）</label>'
    +'<select id="suMic" style="width:100%;background:#101714;color:#cfe6d8;border:1px solid rgba(126,159,144,.4);padding:6px"></select>'
    +'<div style="height:6px;background:rgba(126,159,144,.2);margin-top:8px"><div id="suLv" style="height:100%;width:0;background:#cfe6d8"></div></div>'
    +'<button id="suListen" type="button" style="margin-top:8px;min-height:44px;padding:0 12px;background:#101714;color:#cfe6d8;border:1px solid rgba(126,159,144,.45);cursor:pointer">開啟麥克風監聽</button>'
    +'<div style="display:flex;gap:18px;justify-content:center;margin-top:22px;font-size:13px;letter-spacing:0">'
    +'<button id="suSave" type="button" style="min-height:44px;padding:0 12px;cursor:pointer;color:#e0c178;background:transparent;border:1px solid rgba(224,193,120,.55)">保存配置</button>'
    +'<button id="suGaze" type="button" style="min-height:44px;padding:0 12px;cursor:pointer;color:#cfe6d8;background:transparent;border:1px solid rgba(126,159,144,.4)">校準目光</button>'
    +'<button id="suClose" type="button" style="min-height:44px;padding:0 12px;cursor:pointer;color:#9fb4aa;background:transparent;border:1px solid rgba(126,159,144,.3)">關閉</button></div>'
    +'<div id="suMsg" role="status" aria-live="polite" style="text-align:center;font-size:12px;color:#9fb4aa;margin-top:12px;min-height:16px"></div></div>';
  document.body.appendChild(d);
  let vStream=null,aStream=null,aTimer=null,aAC=null,aSrc=null,aAn=null,disposed=false,vGeneration=0,aGeneration=0;
  const sMsg=t=>{ document.getElementById('suMsg').textContent=t; };
  const media=(typeof navigator!=='undefined')&&navigator.mediaDevices;
  if(!media||!media.getUserMedia||!media.enumerateDevices){ sMsg('此浏览器不支持摄像头/麦克风配置；请用 localhost 的 Chrome 展机打开'); return; }
  const sc=document.getElementById('suCam'), sm=document.getElementById('suMic');
  async function refreshDevices(){ try{ const keepC=sc.value||localStorage.getItem('qg_cam')||'',keepM=sm.value||localStorage.getItem('qg_mic')||'';
    const devs=await media.enumerateDevices(); sc.replaceChildren(); sm.replaceChildren();
    devs.filter(x=>x.kind==='videoinput').forEach((c,i)=>{ const o=document.createElement('option'); o.value=c.deviceId; o.textContent=c.label||('攝像頭 '+(i+1)); sc.appendChild(o); });
    devs.filter(x=>x.kind==='audioinput').forEach((m,i)=>{ const o=document.createElement('option'); o.value=m.deviceId; o.textContent=m.label||('麥克風 '+(i+1)); sm.appendChild(o); });
    if(keepC) sc.value=keepC; if(keepM) sm.value=keepM;
  }catch(e){ sMsg('无法读取设备列表：'+(e&&e.name||e)); } }
  await refreshDevices();
  async function preview(){ const gen=++vGeneration; try{ if(vStream) vStream.getTracks().forEach(t=>t.stop());
    const stream=await media.getUserMedia({video:{deviceId:sc.value?{exact:sc.value}:undefined}});
    if(disposed||gen!==vGeneration){ stream.getTracks().forEach(t=>t.stop()); return; } vStream=stream; await refreshDevices();
    const v=document.getElementById('suVid'); v.srcObject=vStream; v.play(); }catch(e){ sMsg('攝像頭預覽失敗：'+(e&&e.name||e)); } }
  async function listen(){ const gen=++aGeneration; try{ if(aStream) aStream.getTracks().forEach(t=>t.stop()); if(aTimer) cancelAnimationFrame(aTimer); if(aSrc) aSrc.disconnect(); if(aAn) aAn.disconnect();
    const stream=await media.getUserMedia({audio:{deviceId:sm.value?{exact:sm.value}:undefined,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    if(disposed||gen!==aGeneration){ stream.getTracks().forEach(t=>t.stop()); return; } aStream=stream; await refreshDevices();
    aAC=aAC||new (window.AudioContext||window.webkitAudioContext)();
    const src=aAC.createMediaStreamSource(aStream), an=aAC.createAnalyser(); aSrc=src; aAn=an; an.fftSize=1024; src.connect(an);
    const buf=new Float32Array(an.fftSize);
    (function tick(){ an.getFloatTimeDomainData(buf); let s2=0; for(let k=0;k<buf.length;k++) s2+=buf[k]*buf[k];
      document.getElementById('suLv').style.width=Math.min(100,Math.sqrt(s2/buf.length)*900)+'%';
      aTimer=requestAnimationFrame(tick); })(); }catch(e){ sMsg('麥克風監聽失敗：'+(e&&e.name||e)); } }
  sc.onchange=()=>{ if(vStream) preview(); }; sm.onchange=()=>{ if(aStream) listen(); };
  document.getElementById('suPreview').onclick=preview; document.getElementById('suListen').onclick=listen;
  function cleanup(){ disposed=true; vGeneration++; aGeneration++; if(vStream)vStream.getTracks().forEach(t=>t.stop()); if(aStream)aStream.getTracks().forEach(t=>t.stop()); if(aTimer)cancelAnimationFrame(aTimer); if(aSrc)try{aSrc.disconnect();}catch(e){} if(aAn)try{aAn.disconnect();}catch(e){} aSrc=null; aAn=null; const v=document.getElementById('suVid'); if(v)v.srcObject=null; if(aAC){ try{ const p=aAC.close(); if(p&&p.catch)p.catch(()=>{}); }catch(e){} aAC=null; } }
  document.getElementById('suSave').onclick=()=>{ localStorage.setItem('qg_cam',sc.value); localStorage.setItem('qg_mic',sm.value); sMsg('已保存 —— 觀眾入園即生效'); };
  document.getElementById('suGaze').onclick=()=>{ cleanup(); d.remove(); enter(); gazeToggle(); };
  document.getElementById('suClose').onclick=()=>{ cleanup(); location.href=location.pathname; };
})(); }

/* ====== 启动(支持 ?act=N 直入某幕:拾畫「幽」→ ?act=3 入糾纏橋) ====== */
resizeLayout();
{ const _params=new URLSearchParams(location.search), _act=Math.min(STATIONS.length-1, Math.max(0, parseInt(_params.get('act'))||0));
  const _direct=_params.has('act'), _debug=_params.get('debug')==='1', _prelude=_params.get('prelude')==='1', _setup=_params.get('setup')==='1';
  try{ window.__resumeJourney=!_debug&&!_prelude&&sessionStorage.getItem('qg_journey_active')==='1'; }catch(_){ window.__resumeJourney=false; }
  let _resumeGaze=false; try{ _resumeGaze=!_debug&&!_prelude&&!_setup&&sessionStorage.getItem('qg_input_mode')==='gaze'; }catch(_){}
  const _st=STATIONS[_act];
  document.querySelector('#enter .sub').textContent='第 '+MU[_act]+' 幕';
  document.querySelector('#enter .big').textContent=[..._st.name].join(' ');
  document.getElementById('enterStory').textContent=STORY[_act]||'';   // 入园页:该幕的剧情推进句
  document.querySelector('#enterLegend em').textContent=ENTER_PROMPT[_act]||'';
  const _entryLabel=_direct||_debug?'進 入 此 幕':'輕 觸 入 園';
  document.querySelector('#enter .blink').textContent=_entryLabel;
  const _enterEl=document.getElementById('enter');
  _enterEl.setAttribute('aria-label',_entryLabel.replace(/\s+/g,''));
  if(window.__resumeJourney){
    _enterEl.classList.add('journey');
    _enterEl.setAttribute('role','status');
    _enterEl.removeAttribute('tabindex');
    _enterEl.setAttribute('aria-label','第 '+MU[_act]+' 幕 '+_st.name+'，即將自動進入');
  }
  loadStation(_act);
  initPrelude();
  if(_resumeGaze) setTimeout(()=>gazeToggle(true),window.__resumeJourney?(REDUCED?360:2400):260); }
requestAnimationFrame(frame);

/* ====== 幕页浮现 + 自定义光标 + 序声；总片头由沉浸外壳负责 ====== */
(function(){
  const cc=document.getElementById('curcur');
  const entered=()=>document.getElementById('enter').classList.contains('gone');

  /* —— 自定义光标:载入/说明页即生效(柔玉光晕+细金环);入园后画布光标接管 —— */
  addEventListener('pointermove', e=>{ if(!cc) return;
    cc.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)';
    if(!entered()) cc.classList.add('on'); }, {passive:true});

  /* —— 序声:载入/说明页的音。浏览器允许 autoplay(沉浸外壳 allow=autoplay)则即响;否则首次交互即接上 —— */
  const IA={ ac:null, master:null, on:false, timers:[],
    begin(){ if(this.on) return;
      try{ if(!this.ac){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
        this.ac=new AC(); this.master=this.ac.createGain(); this.master.gain.value=0; this.master.connect(this.ac.destination); } }catch(e){ this.ac=null; return; }
      if(this.ac.state==='suspended') this.ac.resume().catch(()=>{});
      if(this.ac.state!=='running') return;                                     // 仍被拦:留待下次手势
      this.on=true; const t=this.ac.currentTime;
      this.master.gain.linearRampToValueAtTime(0.6, t+0.5);
      /* 进入感的环境音 = 温润磬钟余韵铺底:低中音区(宫/角/徵),长尾相叠成连绵共鸣;无噪声(不似海)、无尖锐高频、无低频轰鸣 */
      this.ring(); this.timers.push(setInterval(()=>this.ring(), 2700));        // 每~2.7s 一记,4s 长尾叠成"环境"
    },
    ring(){ const ac=this.ac; if(!ac||!this.on) return; const t=ac.currentTime;
      const f=[261.63, 327.03, 392.44][(Math.random()*3)|0];                    // 宫·角·徵(低八度,温润不沉)
      const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),g2=ac.createGain(),lp=ac.createBiquadFilter();
      o.type='sine'; o.frequency.value=f; o2.type='sine'; o2.frequency.value=f*2; g2.gain.value=0.22;   // +八度薄泛音
      lp.type='lowpass'; lp.frequency.value=820; lp.Q.value=0.4;                // 滤去尖锐高频,圆润
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.03,t+0.5); g.gain.exponentialRampToValueAtTime(0.0004,t+4.2);  // 长尾
      let tail=g; if(ac.createStereoPanner){ const pan=ac.createStereoPanner(); pan.pan.value=(Math.random()*2-1)*0.4; g.connect(pan); tail=pan; }
      o.connect(g); o2.connect(g2); g2.connect(g); tail.connect(lp); lp.connect(this.master);
      o.start(t); o2.start(t); o.stop(t+4.4); o2.stop(t+4.4); },
    bell(f,v){ const ac=this.ac; if(!ac||!this.on) return; const t=ac.currentTime;
      const o=ac.createOscillator(),g=ac.createGain(),o2=ac.createOscillator(),g2=ac.createGain();
      o.type='sine';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2.01;g2.gain.value=0.3;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+2.4);
      o.connect(g);o2.connect(g2);g2.connect(g);g.connect(this.master);o.start(t);o2.start(t);o.stop(t+2.5);o2.stop(t+2.5); },
    stop(){ if(!this.ac) return; for(const tm of this.timers) clearInterval(tm); this.timers=[];
      try{ const ac=this.ac,t=ac.currentTime; this.master.gain.cancelScheduledValues(t);
      this.master.gain.setValueAtTime(this.master.gain.value,t); this.master.gain.linearRampToValueAtTime(0,t+1.4);   // 丝滑渐退,入园不戛然而止
      this.ac=null; this.on=false; setTimeout(()=>{ try{ac.close();}catch(e){} },1600); }catch(e){} } };
  window.__introAudio=IA;
  IA.begin();                                                                   // 尝试自动出声
  addEventListener('pointerdown', ()=>{ if(!entered()){ if(cc) cc.classList.add('on'); IA.begin(); } });  // 被拦则首次交互接上
  addEventListener('keydown', ()=>{ if(!entered()) IA.begin(); });

  /* —— 幕页合焦：预备幕选完方式后，用同一层报第一幕 —— */
  function beginReveal(){
    const big=document.querySelector('#enter .big');
    requestAnimationFrame(()=>{ if(big) big.classList.add('revealed'); });
    const seq=[['.sub',1,180],['.story',0.92,420],['.legend',0.88,620]];
    seq.forEach(([sel,op,d])=>setTimeout(()=>{ const el=document.querySelector('#enter '+sel); if(el) el.style.opacity=op; }, d));
    setTimeout(()=>{ const b=document.querySelector('#enter .blink'); if(b) b.classList.add('go'); }, 820);
    if(window.__resumeJourney) setTimeout(enter,REDUCED?240:2200);    // 正式旅程统一短报幕，不要求每幕重复点击
  }
  beginReveal();
})();

/* ====== 全屏沉浸(2026-06-13 一葳):右上角可见入口「全屏」+ F 键;装在 沉浸.html 外壳(iframe)里时,全屏整个外壳——跨幕换页不掉全屏 ====== */
(function(){
  var framed=false; try{ framed = (window.self!==window.top) && !!window.top.document; }catch(e){ framed=false; }
  function fsDoc(){ return fsDocSafe(); }
  function fsEl(){ return fsElSafe(); }
  function isFS(){ try{ return !!fsDoc().fullscreenElement; }catch(e){ return false; } }
  function reqFS(){ requestAnyFullscreen(); }
  function exitFS(){ try{ if(isFS()){ const p=fsDoc().exitFullscreen(); if(p&&p.catch) p.catch(()=>{}); } }catch(_){} }
  var btn=document.createElement('button'); btn.id='fsBtn'; btn.className='tool'; btn.type='button';
  btn.innerHTML='<span class="glyph" aria-hidden="true">⛶</span>';
  btn.setAttribute('aria-label','进入全屏'); btn.title='全屏';
  function toggle(e){ if(e){ e.stopPropagation(); e.preventDefault(); } isFS()?exitFS():reqFS(); }
  btn.addEventListener('click', toggle);
  function syncLabel(){ const on=isFS(); btn.dataset.active=on?'true':'false'; btn.setAttribute('aria-label',on?'退出全屏':'进入全屏'); btn.title=on?'退出全屏':'全屏'; }
  document.addEventListener('fullscreenchange', syncLabel);
  var topFsDoc=null; try{ if(framed){ topFsDoc=window.top.document; topFsDoc.addEventListener('fullscreenchange', syncLabel); } }catch(e){}
  function mount(){ const rail=document.querySelector('.toolrail'); (rail||document.body||document.documentElement).appendChild(btn); }
  if(document.body) mount(); else addEventListener('DOMContentLoaded', mount);
  addEventListener('keydown', function(e){
    if(e.key==='f'||e.key==='F'){ toggle(e); return; }
  }, {capture:true});
  addEventListener('pagehide',function(){ document.removeEventListener('fullscreenchange',syncLabel);
    try{ if(topFsDoc) topFsDoc.removeEventListener('fullscreenchange',syncLabel); }catch(e){}
    try{ MIC.stop(); }catch(e){} try{ endGazeSession(); }catch(e){} },{once:true});
})();
